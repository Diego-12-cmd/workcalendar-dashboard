  const fmtDate = d =>
    `${d.getUTCDate().toString().padStart(2,'0')}/${(d.getUTCMonth()+1).toString().padStart(2,'0')}/${d.getUTCFullYear()}`;

  const dname = di => (isTurno43(S.week) ? DNAMES43 : {})[di] || DNAMES[di];

  // ════════════════════════════════════════════════════════════
  // HOJA GUÍA — explicación simple de cada pestaña
  // ════════════════════════════════════════════════════════════
  const guideRows = [
    [`DASHBOARD OPERACIONAL — ${semana}`, ''],
    [`Turno: ${tr}  |  Semana: ${semana}  |  Generado: ${new Date().toLocaleString('es-CL')}`, ''],
    ['', ''],
    ['CONTENIDO DEL ARCHIVO', ''],
    ['Pestaña', 'Descripción'],
    ['📊 Resumen KPIs', 'Indicadores globales de la semana: tareas, Flex, Yo Detengo, OT y OS. Incluye resumen por persona y estado del Yo Detengo por día.'],
    ['🟢 Estado Personal', 'Estado diario de cada persona del turno: presente, vacaciones, licencia, permiso o ausente. Muestra quién cubrió cada reemplazo.'],
    ['📋 Tareas Semanales', 'Registro completo de tareas por persona y día. Incluye Flex (solo días con cantidad > 0) y Yo Detengo con quién lo realizó.'],
    ['📍 Asistencia', 'Área o ubicación de trabajo de cada persona por día. Útil para verificar dónde estuvo cada uno.'],
    ['📝 Notas del Turno', 'Observaciones o comentarios escritos para cada día del turno.'],
    ['🔧 OS Actividades', 'Actividades de equipos registradas: responsable, equipo, modelo, TAG, pauta y si fue realizada.'],
    ['📋 Órdenes de Trabajo', 'Órdenes SAP del turno: N° OT, descripción, horas planificadas vs reales y estado de ejecución.'],
    ['', ''],
    ['CÓMO LEER LOS INDICADORES', ''],
    ['Columna', 'Significado'],
    ['✅ Óptimo', 'Más del 80% completado.'],
    ['⚠️ En progreso', 'Entre 50% y 79% completado.'],
    ['❌ Bajo', 'Menos del 50% completado.'],
    ['✅ Sí / ❌ No', 'Indica si una tarea, OS u OT fue realizada.'],
    ['⏳ Pendiente', 'Tarea aún no completada al momento de exportar.'],
    ['Reemplazo de: X', 'Persona que cubrió a X durante su ausencia.'],
  ];
  const _gLen = guideRows.length;
  const wsG = XLSX.utils.aoa_to_sheet(guideRows);
  wsG['!cols'] = [{wch:28},{wch:80}];
  wsG['!merges'] = [
    {s:{r:0,c:0},e:{r:0,c:1}},
    {s:{r:1,c:0},e:{r:1,c:1}},
    {s:{r:3,c:0},e:{r:3,c:1}},
    {s:{r:13,c:0},e:{r:13,c:1}},
  ];
  styleRow(wsG, 0, 2, true, C.navy, C.white, 14);
  styleRow(wsG, 1, 2, false, C.slate, C.white, 10);
  styleRow(wsG, 3, 2, true, C.header, C.white, 11);
  styleRow(wsG, 4, 2, true, C.blue, C.white, 10);
  for (let r = 5; r <= 11; r++) styleDataRow(wsG, r, 2, (r-5)%2===1);
  styleRow(wsG, 13, 2, true, C.header, C.white, 11);
  styleRow(wsG, 14, 2, true, C.blue, C.white, 10);
  for (let r = 15; r < _gLen; r++) styleDataRow(wsG, r, 2, (r-15)%2===1);
  wsG['!rows'] = [{hpt:30},{hpt:16},...Array(_gLen-2).fill({hpt:20})];
  XLSX.utils.book_append_sheet(wb, wsG, '📖 Guía');

  // ════════════════════════════════════════════════════════════
  // HOJA 0 — RESUMEN / KPIs
  // ════════════════════════════════════════════════════════════
  // Recopilar datos usando getDT (sistema actual por día)
  let totalTareas = 0, tareasCompletadas = 0, totalCantidad = 0;
  let actTotal = 0, actDone = 0;
  let ydTotal = 0;

  // allTaskEntries agrupa por persona los resultados de todos los días activos
  const perPersona = {};
  function _addEntry(person, done, qty) {
    if (!perPersona[person]) perPersona[person] = {total:0, done:0, qty:0};
    perPersona[person].total++;
    if (done) perPersona[person].done++;
    perPersona[person].qty += qty;
    totalTareas++;
    if (done) tareasCompletadas++;
    totalCantidad += qty;
  }

  activeDays.forEach(({date: d, di: i}) => {
    // Actividades diarias
    const dd = (w.days || {})[i] || {};
    (dd.items || []).forEach(it => { actTotal++; if (it.done) actDone++; });
    // Yo Detengo
    const ydData = ((w.dayTasks || {})[i] || {})['yd0'] || {};
    ydTotal += Object.values(ydData).reduce((a,v) => a + (v.qty||0), 0);
    // Tareas del día usando getDT
    function collectDayTask(taskId, defaultPpl) {
      const filteredDefault = (defaultPpl || []).filter(p => LISTS.personal.includes(p));
      const assigned = getDayTaskPeople(i, taskId, filteredDefault).filter(p => LISTS.personal.includes(p));
      const effective = resolveEffectivePeople(i, assigned)
        .filter(e => !e.isReplacement || !isRepExcludedFromTask(i, taskId, e.name));
      effective.forEach(e => {
        const dta = getDT(i, taskId, e.name);
        _addEntry(e.name, dta.done, dta.qty||0);
      });
    }
    DFLT.forEach(dt => {
      if (dt.id === 'flex') return; // Flex se reporta por separado
      if (dt.sub.length) getSubs(dt.id, dt).forEach(s => collectDayTask(`${dt.id}__${s.id}`, s.people||(w.people||[])));
      else collectDayTask(dt.id, (w.people||[]));
    });
    (w.customTasks || []).forEach(ct => {
      if (ct.dias && ct.dias.length > 0 && !ct.dias.includes(i)) return;
      if ((ct.sub||[]).length) (ct.sub||[]).forEach(s => collectDayTask(`${ct.id}__${s.id}`, s.people||(w.people||[])));
      else collectDayTask(ct.id, ct.people||(w.people||[]));
    });
  });

  const pct = totalTareas > 0 ? Math.round(tareasCompletadas / totalTareas * 100) : 0;
  const actPct = actTotal > 0 ? Math.round(actDone / actTotal * 100) : 0;

  // Totales OS (panel de actividades de equipos)
  const _osP = w.osPanel || { items: {} };
  const _osItems = Object.values(_osP.items || {});
  const osTot = _osItems.length;
  const osDone = _osItems.filter(x => x.done).length;
  const osPct = osTot > 0 ? Math.round(osDone/osTot*100) : 0;

  // Totales OT (órdenes de trabajo SAP)
  const _woP = w.workOrders || { items: {} };
  const _woItems = Object.values(_woP.items || {});
  const woTot = _woItems.length;
  const woDone = _woItems.filter(x => x.done).length;
  const woPct = woTot > 0 ? Math.round(woDone/woTot*100) : 0;
  const woHrsTot = _woItems.reduce((a,o) => a + (parseFloat(o.hours)||0), 0);
  const woRealTot = _woItems.reduce((a,o) => {
    const rh = parseFloat(o.realHours);
    if (!isNaN(rh) && o.realHours !== '' && o.realHours != null) return a + rh;
    if (o.done) return a + (parseFloat(o.hours)||0);
    return a;
  }, 0);
  const woHrsPctKpi = woHrsTot > 0 ? Math.round(woRealTot/woHrsTot*100) : 0;

  const kpiRows = [
    [`DASHBOARD OPERACIONAL — ${semana}`, '', '', '', ''],
    [`Turno: ${tr}`, `Semana: ${semana}`, `Personal: ${allPpl.length}`, `Exportado: ${new Date().toLocaleDateString('es-CL')}`, ''],
    ['', '', '', '', ''],
    ['📊 INDICADORES CLAVE DE LA SEMANA', '', '', '', ''],
    ['Indicador', 'Realizadas', 'Total', '% Avance', 'Estado'],
    ['Tareas semanales', tareasCompletadas, totalTareas, `${pct}%`, pct >= 80 ? '✅ Óptimo' : pct >= 50 ? '⚠️ En progreso' : '❌ Bajo'],

    ['OS · Actividades de equipos', osDone, osTot, `${osPct}%`, osTot===0 ? '— Sin datos' : osPct >= 80 ? '✅ Óptimo' : osPct >= 50 ? '⚠️ En progreso' : '❌ Bajo'],
    ['Órdenes de Trabajo (SAP)', woDone, woTot, `${woPct}%`, woTot===0 ? '— Sin datos' : woPct >= 80 ? '✅ Óptimo' : woPct >= 50 ? '⚠️ En progreso' : '❌ Bajo'],
    ['Horas SAP acumuladas', woHrsTot, '', '', 'Suma de horas de las OT'],
    ['Horas reales acumuladas', woRealTot, '', `${woHrsPctKpi}%`, woHrsTot===0 ? '— Sin datos' : woHrsPctKpi >= 80 ? '✅ Óptimo' : woHrsPctKpi >= 50 ? '⚠️ En progreso' : '❌ Bajo'],
    ['Total cantidad (tareas)', totalCantidad, '', '', ''],
    ['Yo Detengo (semana)', ydTotal, '', '', ''],
    ['Personal a cargo', allPpl.length, '', '', allPpl.join(', ')],
    ['', '', '', '', ''],
    ['👤 RESUMEN POR PERSONA', '', '', '', ''],
    ['Persona', 'Tareas Asignadas', 'Completadas', '% Completado', 'Cantidad Total'],
  ];
  // Calcular y agregar Flex resumen al KPI
  const _flexSubs=[{id:'ovcc',label:'OVCC'},{id:'ops',label:'OPS'},{id:'ctp',label:'CTP'}];
  let _flexTotal=0, _flexDone=0;
  activeDays.forEach(({di:i})=>{
    _flexSubs.forEach(s=>{
      const tid='flex__'+s.id;
      const bppl=allPpl.filter(p=>LISTS.personal.includes(p));
      resolveEffectivePeople(i,bppl).forEach(e=>{
        const dta=getDT(i,tid,e.name);
        if((dta.qty||0)>0){_flexTotal+=(dta.qty||0); if(dta.done) _flexDone+=(dta.qty||0);}
      });
    });
  });
  kpiRows.push(['Flex cantidad total semana', _flexDone, _flexTotal, _flexTotal>0?Math.round(_flexDone/_flexTotal*100)+'%':'—', '']);
  Object.entries(perPersona).forEach(([p, v]) => {
    kpiRows.push([p, v.total, v.done, `${v.total>0?Math.round(v.done/v.total*100):0}%`, v.qty]);
  });
  kpiRows.push(['', '', '', '', '']);
  kpiRows.push(['📅 RESUMEN POR DÍA', '', '', '', '']);
  kpiRows.push(['Día', 'Fecha', 'Yo Detengo', '', '']);
  activeDays.forEach(({date: d, di: i}) => {
    const basePplKpi = allPpl.filter(p => LISTS.personal.includes(p));
    const ydEffKpi = resolveEffectivePeople(i, basePplKpi);
    const ydDoneEntry = ydEffKpi.find(e => getDT(i,'yd0',e.name).done);
    const ydCell = ydDoneEntry ? `✅ ${ydDoneEntry.name}` : '⏳ Pendiente';
    kpiRows.push([dname(i), fmtDate(d), ydCell, '', '']);
  });

  const ws0 = XLSX.utils.aoa_to_sheet(kpiRows);
  ws0['!cols'] = [{wch:32},{wch:18},{wch:14},{wch:14},{wch:40}];
  // Merge title rows (calculados por posición de encabezados)
  const _pIdx = kpiRows.findIndex(r => r[0] === '👤 RESUMEN POR PERSONA');
  ws0['!merges'] = [
    {s:{r:0,c:0}, e:{r:0,c:4}},
    {s:{r:3,c:0}, e:{r:3,c:4}},
    {s:{r:_pIdx,c:0},e:{r:_pIdx,c:4}},
  ];
  // Título y subtítulo
  styleRow(ws0, 0, 5, true, C.navy, C.white, 14);
  styleRow(ws0, 1, 5, false, C.slate, C.white, 10);
  // Bloque indicadores clave
  styleRow(ws0, 3, 5, true, C.header, C.white, 11);
  styleRow(ws0, 4, 5, true, C.blue, C.white, 10);
  const _persHdr = kpiRows.findIndex(r => r[0] === '👤 RESUMEN POR PERSONA');
  for (let r = 5; r < _persHdr - 1; r++) styleDataRow(ws0, r, 5, (r-5)%2===1);
  // Per-day section
  const dayHdrIdx = kpiRows.findIndex(r => r[0] === '📅 RESUMEN POR DÍA');
  if (dayHdrIdx >= 0) {
    styleRow(ws0, dayHdrIdx, 5, true, C.teal, C.white, 11);
    styleRow(ws0, dayHdrIdx+1, 5, true, C.blue, C.white, 10);
    for (let r = dayHdrIdx+2; r < kpiRows.length; r++) styleDataRow(ws0, r, 5, (r-(dayHdrIdx+2))%2===1);
  }
  // Persona section
  const pHdrIdx = kpiRows.findIndex(r => r[0] === '👤 RESUMEN POR PERSONA');
  if (pHdrIdx >= 0) {
    styleRow(ws0, pHdrIdx, 5, true, C.purple, C.white, 11);
    styleRow(ws0, pHdrIdx+1, 5, true, C.blue, C.white, 10);
    const nPpl = Object.keys(perPersona).length;
    for (let r = pHdrIdx+2; r < pHdrIdx+2+nPpl; r++) styleDataRow(ws0, r, 5, (r-(pHdrIdx+2))%2===1);
  }
  ws0['!rows'] = [{hpt:28},{hpt:18}];
  // ════════════════════════════════════════════════════════════
  // HOJA 6 — ESTADO PERSONAL (nuevo)
  // ════════════════════════════════════════════════════════════
  const stRows = [
    [`ESTADO DEL PERSONAL — ${semana}`, '', '', '', '', ''],
    ['Día', 'Fecha', 'Persona', 'Estado', 'Reemplazo / Cubre', 'Observación'],
  ];
  activeDays.forEach(({date: d, di: i}) => {
    const fecha = fmtDate(d);
    const effective = resolveEffectivePeople(i, allPpl.filter(p => LISTS.personal.includes(p)));
    effective.forEach(e => {
      const nombreMostrado = e.isReplacement ? `${e.name} (Reemplazo)` : e.name;
      const st = e.isReplacement
        ? { estado: 'Reemplazo', obs: `Cubre a ${e.replacedFor}` }
        : getPplStatus(i, e.name);
      stRows.push([dname(i), fecha, nombreMostrado, st.estado, e.isReplacement ? e.replacedFor : '', st.obs||'']);
    });
  });
  const ws6 = XLSX.utils.aoa_to_sheet(stRows);
  ws6['!cols'] = [{wch:8},{wch:12},{wch:28},{wch:12},{wch:28},{wch:35}];
  ws6['!merges'] = [{s:{r:0,c:0},e:{r:0,c:5}}];
  styleRow(ws6, 0, 6, true, C.navy, C.white, 13);
  styleRow(ws6, 1, 6, true, C.header, C.white, 10);
  for (let r = 2; r < stRows.length; r++) {
    styleDataRow(ws6, r, 6, (r-2)%2===1);
    // Colorear estado
    const stRef = XLSX.utils.encode_cell({r, c:3});
    const estado = stRows[r][3];
    const stColor = {Presente:'FF166534',Ausente:'FF991B1B',Permiso:'FFB45309',Licencia:'FF6D28D9',Vacaciones:'FF0369A1'}[estado];
    if (ws6[stRef] && stColor) ws6[stRef].s = {...(ws6[stRef].s||{}), font:{bold:true,color:{rgb:stColor},sz:10,name:'Arial'}};
  }


  XLSX.utils.book_append_sheet(wb, ws0, '📊 Resumen KPIs');
  XLSX.utils.book_append_sheet(wb, ws6, '🟢 Estado Personal');

  // ════════════════════════════════════════════════════════════
  // HOJA 1 — TAREAS SEMANALES
  // ════════════════════════════════════════════════════════════
  const taskRows = [
    [`TAREAS SEMANALES — ${semana}`, '', '', '', '', '', '', '', ''],
    ['Turno', 'Día', 'Fecha', 'Tipo', 'Tarea', 'Persona', 'Realizado', 'Cantidad'],
  ];
  function exportTask(dt, isCustom) {
    activeDays.forEach(({date: d, di: i}) => {
      function exportDayTaskWeekly(taskId, label, defaultPpl) {
        if (isCustom && dt.dias && dt.dias.length > 0 && !dt.dias.includes(i)) return;
        const filteredDefault = (defaultPpl || []).filter(p => LISTS.personal.includes(p));
        const assigned = getDayTaskPeople(i, taskId, filteredDefault).filter(p => LISTS.personal.includes(p));
        const effective = resolveEffectivePeople(i, assigned)
          .filter(e => !e.isReplacement || !isRepExcludedFromTask(i, taskId, e.name));
        if (!effective.length) return;
        effective.forEach(e => {
          const dta = getDT(i, taskId, e.name);
          const nombreMostrado = e.isReplacement ? `${e.name} (Reemplazo)` : e.name;
          taskRows.push([tr, dname(i), fmtDate(d), isCustom?'Custom':'Fija', label, nombreMostrado, dta.done?'Sí':'No', dta.qty||0]);
        });
      }
      if ((dt.sub||[]).length) {
        const dbSubs = isCustom ? (dt.sub||[]) : getSubs(dt.id, dt);
        dbSubs.forEach(s => exportDayTaskWeekly(`${dt.id}__${s.id}`, `${dt.label} › ${s.label}`, s.people||(w.people||[])));
      } else {
        exportDayTaskWeekly(dt.id, dt.label, isCustom ? (dt.people||(w.people||[])) : (getT(dt.id).people !== undefined ? getT(dt.id).people : (w.people||[])));
      }
    });
  }
  DFLT.forEach(dt => { if (dt.id === 'flex') return; exportTask(dt, false); });
  (w.customTasks || []).forEach(ct => exportTask(ct, true));
  // Flex: agregar filas solo donde qty > 0
  const _fSubs=[{id:'ovcc',label:'OVCC'},{id:'ops',label:'OPS'},{id:'ctp',label:'CTP'}];
  activeDays.forEach(({date:d,di:i})=>{
    _fSubs.forEach(s=>{
      const tid='flex__'+s.id;
      const bppl=allPpl.filter(p=>LISTS.personal.includes(p));
      resolveEffectivePeople(i,bppl).forEach(e=>{
        const dta=getDT(i,tid,e.name);
        if((dta.qty||0)>0){
          const nm=e.isReplacement?`${e.name} (Reemplazo)`:e.name;
          taskRows.push([tr, dname(i), fmtDate(d), 'Fija', `Flex › ${s.label}`, nm, dta.done?'Sí':'No', dta.qty]);
        }
      });
    });
  });
  taskRows.push(['', '', '', '', `TOTAL (${taskRows.length-2} registros)`, '', `${tareasCompletadas} / ${totalTareas} (${pct}%)`, totalCantidad]);

  const ws1 = XLSX.utils.aoa_to_sheet(taskRows);
  ws1['!cols'] = [{wch:12},{wch:8},{wch:12},{wch:10},{wch:30},{wch:26},{wch:10},{wch:10}];
  ws1['!merges'] = [{s:{r:0,c:0},e:{r:0,c:7}}];
  styleRow(ws1, 0, 8, true, C.navy, C.white, 13);
  styleRow(ws1, 1, 8, true, C.header, C.white, 10);
  for (let r = 2; r < taskRows.length-1; r++) {
    styleDataRow(ws1, r, 8, (r-2)%2===1);
    const nombre = taskRows[r][5] || '';
    if (nombre.includes('(Reemplazo)')) {
      const nRef = XLSX.utils.encode_cell({r, c:5});
      if (ws1[nRef]) ws1[nRef].s = {...(ws1[nRef].s||{}), font:{bold:true,color:{rgb:'FFB45309'},sz:10,name:'Arial'}};
    }
  }
  styleRow(ws1, taskRows.length-1, 8, true, C.green, C.white, 10);
  XLSX.utils.book_append_sheet(wb, ws1, '📋 Tareas Semanales');





  // ════════════════════════════════════════════════════════════
  // ════════════════════════════════════════════════════════════
  // HOJA 5 — ASISTENCIA / ÁREA
  // ════════════════════════════════════════════════════════════
  const attRows = [
    [`ASISTENCIA POR DÍA — ${semana}`, '', '', '', '', ''],
    ['Turno', 'Día', 'Fecha', 'Persona', 'Cubre a', 'Área / Ubicación'],
  ];
  let attCount = 0;
  activeDays.forEach(({date: d, di: i}) => {
    const fecha = fmtDate(d);
    const effective = resolveEffectivePeople(i, allPpl);
    effective.forEach(e => {
      const area = ((w.attendance || {})[i] || {})[e.name] || '';
      const nombreMostrado = e.isReplacement ? `${e.name} (Reemplazo)` : e.name;
      const cubreA = e.isReplacement ? e.replacedFor : '';
      attRows.push([tr, dname(i), fecha, nombreMostrado, cubreA, area]);
      if (area) attCount++;
    });
  });
  attRows.push(['','','',`Presentes efectivos: ${attCount}`, '', '']);

  const ws5 = XLSX.utils.aoa_to_sheet(attRows);
  ws5['!cols'] = [{wch:12},{wch:8},{wch:12},{wch:32},{wch:28},{wch:35}];
  ws5['!merges'] = [{s:{r:0,c:0},e:{r:0,c:5}}];
  styleRow(ws5, 0, 6, true, C.navy, C.white, 13);
  styleRow(ws5, 1, 6, true, C.header, C.white, 10);
  for (let r = 2; r < attRows.length-1; r++) {
    styleDataRow(ws5, r, 6, (r-2)%2===1);
    const nombre = attRows[r][3] || '';
    if (nombre.includes('(Reemplazo)')) {
      const nRef = XLSX.utils.encode_cell({r, c:3});
      if (ws5[nRef]) ws5[nRef].s = {...(ws5[nRef].s||{}), font:{bold:true,color:{rgb:'FFB45309'},sz:10,name:'Arial'}};
    }
  }
  styleRow(ws5, attRows.length-1, 6, true, C.slate, C.white, 10);
  XLSX.utils.book_append_sheet(wb, ws5, '📍 Asistencia');


  // ════════════════════════════════════════════════════════════
  // HOJA 7 — NOTAS DEL TURNO (nuevo)
  // ════════════════════════════════════════════════════════════
  const notasRows = [
    [`NOTAS DEL TURNO — ${semana}`, '', '', ''],
    ['Día', 'Fecha', 'Turno', 'Nota / Observaciones'],
  ];
  activeDays.forEach(({date: d, di: i}) => {
    const nota = getDayNote(i);
    notasRows.push([dname(i), fmtDate(d), tr, nota || '']);
  });
  const ws7 = XLSX.utils.aoa_to_sheet(notasRows);
  ws7['!cols'] = [{wch:8},{wch:12},{wch:14},{wch:80}];
  ws7['!merges'] = [{s:{r:0,c:0},e:{r:0,c:3}}];
  styleRow(ws7, 0, 4, true, C.navy, C.white, 13);
  styleRow(ws7, 1, 4, true, C.header, C.white, 10);
  for (let r = 2; r < notasRows.length; r++) styleDataRow(ws7, r, 4, (r-2)%2===1);

  const osRows = [
    [`OS — ACTIVIDADES DE EQUIPOS — ${semana}`, '', '', '', '', '', '', '', '', ''],

  let osTotalActs = 0, osHechas = 0;
  activeDays.forEach(({date: d, di: i}) => {
    const fecha = fmtDate(d);

    if (ids.length) {

        if (!a) return;
        osRows.push([tr, dname(i), fecha, a.responsable||'—', a.tipoEquipo||'—', a.modelo||'—', a.serie||'—', a.area||'—', a.tag||'—', a.pauta||'—', a.numeroOS||'', a.nota||'', a.done ? 'Sí' : 'No']);
        osTotalActs++;
        if (a.done) osHechas++;
      });
    } else {
      osRows.push([tr, dname(i), fecha, '—', '—', '—', '—', '—', '—', '—', '', '', '—']);
    }
  });
  osRows.push(['','','',`Total: ${osTotalActs}`, '', '', '', '', '', '', '', `Realizadas: ${osHechas}/${osTotalActs}`, osTotalActs>0 ? `${Math.round(osHechas/osTotalActs*100)}%` : '0%']);

    styleDataRow(ws8, r, 12, (r-2)%2===1);
    const cRef = XLSX.utils.encode_cell({r, c:11});
    const cVal = osRows[r][11];

  }
  styleRow(ws8, osRows.length-1, 12, true, C.green, C.white, 10);
  XLSX.utils.book_append_sheet(wb, ws8, '🔧 OS Actividades');

  // ════════════════════════════════════════════════════════════
  // HOJA 9 — ÓRDENES DE TRABAJO (SAP)
  // ════════════════════════════════════════════════════════════
  const woData = w.workOrders || { items: {}, byDay: {} };
  const woItems = woData.items || {};
  const woByDay = woData.byDay || {};
  const woRows = [
    [`ÓRDENES DE TRABAJO (SAP) — ${semana}`, '', '', '', '', '', '', '', '', ''],
    ['Turno', 'Día', 'Fecha', 'N° OT', 'Descripción', 'Sortfield', 'Horas Excel', 'Horas Reales', 'Nota', 'Realizada'],
  ];
  let woTotal = 0, woHechas = 0, woHoras = 0, woReales = 0;
  activeDays.forEach(({date: d, di: i}) => {
    const fecha = fmtDate(d);
    const ids = woByDay[i] || [];
    if (ids.length) {
      ids.forEach(id => {
        const o = woItems[id];
        if (!o) return;
        const hrs = parseFloat(o.hours) || 0;
        const rhrs = parseFloat(o.realHours) || 0;
        woRows.push([tr, dname(i), fecha, o.ot||'—', o.desc||'—', o.sortfield||'—', o.hours!==''&&o.hours!=null?o.hours:'—', o.realHours!==''&&o.realHours!=null?o.realHours:'—', o.nota||'', o.done ? 'Sí' : 'No']);
        woTotal++;
        if (o.done) woHechas++;
        woHoras += hrs;
        const effectiveReal = (o.realHours !== '' && o.realHours !== null && o.realHours !== undefined && !isNaN(parseFloat(o.realHours)))
          ? parseFloat(o.realHours)
          : (o.done ? hrs : 0);
        woReales += effectiveReal;
      });
    } else {
      woRows.push([tr, dname(i), fecha, '—', '— Sin órdenes —', '—', '—', '—', '', '—']);
    }
  });
  const woHrsPct = woHoras>0 ? Math.round(woReales/woHoras*100) : 0;
  woRows.push(['','','',`Total: ${woTotal}`, '', 'TOTALES →', woHoras, woReales, `Realizadas: ${woHechas}/${woTotal}`, woTotal>0 ? `${Math.round(woHechas/woTotal*100)}%` : '0%']);
  woRows.push(['','','','','','CUMPLIMIENTO HORAS →', `${woReales} / ${woHoras} h`, `${woHrsPct}%`, '', '']);

  const ws9 = XLSX.utils.aoa_to_sheet(woRows);
  ws9['!cols'] = [{wch:12},{wch:8},{wch:12},{wch:14},{wch:48},{wch:22},{wch:11},{wch:12},{wch:28},{wch:10}];
  ws9['!merges'] = [{s:{r:0,c:0},e:{r:0,c:9}}];
  styleRow(ws9, 0, 10, true, C.navy, C.white, 13);
  styleRow(ws9, 1, 10, true, C.header, C.white, 10);
  for (let r = 2; r < woRows.length-2; r++) {
    styleDataRow(ws9, r, 10, (r-2)%2===1);
    const cRef = XLSX.utils.encode_cell({r, c:9});
    const cVal = woRows[r][9];
    if (ws9[cRef] && cVal === 'Sí') ws9[cRef].s = {...(ws9[cRef].s||{}), font:{bold:true,color:{rgb:'FF166534'},sz:10,name:'Arial'}};
    if (ws9[cRef] && cVal === 'No') ws9[cRef].s = {...(ws9[cRef].s||{}), font:{bold:true,color:{rgb:'FF991B1B'},sz:10,name:'Arial'}};
  }
  styleRow(ws9, woRows.length-2, 10, true, C.green, C.white, 10);
  styleRow(ws9, woRows.length-1, 10, true, woHrsPct>=80?C.green:C.red, C.white, 11);
  XLSX.utils.book_append_sheet(wb, ws9, '📋 Órdenes de Trabajo');

  const isoW = getISOWeek(getWeekDays(S.week)[0]);
  XLSX.writeFile(wb, `Dashboard-Operacional-W${isoW}.xlsx`);
}

// ── Claves de snapshot para renderizado parcial ───────────────────────────────
// Cada sección del DOM guarda un hash de los datos que la generaron.
// Si el hash no cambió, se salta el redibujado de esa sección.
const _snapshots = {};
function _snap(key, data) {
  const s = JSON.stringify(data);
  if (_snapshots[key] === s) return false; // sin cambio
  _snapshots[key] = s;
  return true; // cambió
}
function _invalidateSnap(key) { delete _snapshots[key]; }
function _invalidateAllSnaps() { Object.keys(_snapshots).forEach(k => delete _snapshots[k]); }

// Procesa el archivo Excel cargado
function handleWOFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
      if (!rows.length) { alert('El archivo está vacío.'); return; }

      // Localizar columnas por encabezado
      const header = rows[0].map(h => String(h || '').trim().toUpperCase());
      const colDate = header.indexOf('STARTDATE');
      const colOT   = header.indexOf('ORDEN DE TRABAJO');
      const colDesc = header.indexOf('OP_DESCRIPTION');
      const colSort = header.indexOf('SORTFIELD');
      const colHrs  = header.indexOf('HOURS');
      if (colDate < 0 || colOT < 0) {
        alert('No se encontraron las columnas STARTDATE / Orden de trabajo. Verifica el archivo.');
        return;
      }

      const items = {};
      const byDay = {}; // di -> [woId...]
      const weekDays = getWeekDays(S.week);
      // Mapa fecha (YYYY-MM-DD) -> di
      const dateToDi = {};
      weekDays.forEach((d, i) => {
        const k = `${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`;
        dateToDi[k] = i;
      });

      let added = 0, skipped = 0;
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || row[colDate] == null) { skipped++; continue; }
        let dt = row[colDate];
        if (!(dt instanceof Date)) {
          const parsed = new Date(dt);
          if (isNaN(parsed)) { skipped++; continue; }
          dt = parsed;
        }
        const key = `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
        const di = dateToDi[key];
        if (di === undefined) { skipped++; continue; } // fuera de la semana

        const woId = `wo_${r}_${Date.now().toString(36)}`;
        items[woId] = {
          fecha: `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`,
          ot: String(row[colOT] ?? '').trim(),
          desc: colDesc >= 0 ? String(row[colDesc] ?? '').trim() : '',
          sortfield: colSort >= 0 ? String(row[colSort] ?? '').trim() : '',
          hours: colHrs >= 0 ? (row[colHrs] ?? '') : '',
          realHours: '',
          done: false,
        };
        if (!byDay[di]) byDay[di] = [];
        byDay[di].push(woId);
        added++;
      }

      if (added === 0) {
        alert(`No se cargó ninguna OT.\nNinguna fecha coincide con la semana actual (${getWeekLabel(S.week)}).\nCambia a la semana correcta antes de cargar.`);
        return;
      }
      swd({ workOrders: { items, byDay } });
      alert(`✅ ${added} órdenes de trabajo cargadas.${skipped ? `\n(${skipped} filas omitidas por estar fuera de la semana o sin fecha)` : ''}`);
    } catch (err) {
      alert('Error al leer el archivo: ' + err.message);
    } finally {
      input.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}
window.handleWOFile = handleWOFile;

function renderWorkOrders() {
  const w = wd();
  const wo = w.workOrders || { items: {}, byDay: {} };
  const items = wo.items || {};
  const byDay = wo.byDay || {};
  const total = Object.keys(items).length;
  const done = Object.values(items).filter(i => i.done).length;
  const pct = total > 0 ? Math.round(done/total*100) : 0;

  // Estado del día actual (o primer día activo si hoy no está en la semana)
  const now = new Date();
  const todayUTC = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const activeDaysH = getActiveDays(S.week);
  let todayDi = activeDaysH.findIndex(({date:d}) => d.getTime() === todayUTC.getTime());
  if (todayDi < 0) todayDi = 0; // si hoy no está en esta semana, primer día activo
  const todayIdx = activeDaysH[todayDi]?.di ?? 0;
  const todayItems = (byDay[todayIdx] || []).map(id => ({id, ...items[id]})).filter(x => x.ot !== undefined);
  const todayPending = todayItems.filter(x => !x.done);
  // Días pasados con OTs sin tickear
  const pastUnmarkedWO = activeDaysH.filter(({date:d, di:i}) => {
    if (d.getTime() >= todayUTC.getTime()) return false;
    const dayItems = (byDay[i] || []).map(id => ({id, ...items[id]})).filter(x => x.ot !== undefined);
    if (dayItems.length === 0) return false;
    return !dayItems.every(x => x.done);
  });

  const todayDate = `${String(todayUTC.getUTCDate()).padStart(2,'0')}/${String(todayUTC.getUTCMonth()+1).padStart(2,'0')}/${todayUTC.getUTCFullYear()}`;

  // Badge de hoy (OT)
  let woTodayBadge = '';
  if (total > 0) {
    if (todayItems.length === 0) {
      woTodayBadge = `<span style="font-size:17px;color:#64748b;margin-left:10px">⬜ Sin OTs hoy</span>`;
    } else if (todayPending.length === 0) {
      woTodayBadge = `<span style="font-size:17px;color:#22c55e;font-weight:700;margin-left:10px"><i class="ti ti-circle-check" style="color:#22c55e"></i> OTs DE HOY ${todayDate} REALIZADAS</span>`;
    } else {
      woTodayBadge = `<span style="font-size:17px;color:#ef4444;font-weight:700;margin-left:10px;display:inline-flex;align-items:baseline;gap:6px;flex-wrap:nowrap"><i class="ti ti-alert-circle" style="color:#ef4444"></i> OTs pendientes hoy</span>`;
    }
  }
  // Badge días pasados sin marcar (OT)
  let woPastBadge = '';
  if (pastUnmarkedWO.length > 0) {
    const labelsWO = pastUnmarkedWO.map(({date:d, di:i}) => {
      const dn = (isTurno43(S.week)?DNAMES43:{})[i]||DNAMES[i]||'?';
      return `${dn} ${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}`;
    }).join(', ');
    woPastBadge = `<span style="font-size:17px;color:#f59e0b;font-weight:700;margin-left:16px"><i class="ti ti-alert-triangle" style="color:#f59e0b"></i> OTs SIN MARCAR: ${labelsWO}</span>`;
  }
  const todayBadge = woTodayBadge + woPastBadge;

  // Chips OTs pendientes del día activo (solo pendientes, con parpadeo)
  const pendingWOChips = todayItems.filter(it => !it.done)
    .map(it => `<button class="chip-pending" style="margin-left:6px" onclick="event.stopPropagation();expandAndHlRow('wo','wo-row-${it.id}')" title="${esc(it.desc||'')}">${esc(it.ot||'—')}</button>`)
    .join('');

  let h = `<div class="ppl-mgmt" style="margin-top:14px">
    <div class="ppl-mgmt-hdr" onclick="toggleWO()">
      <span class="lbl" style="font-size:17px;display:inline-flex;align-items:center;flex-wrap:wrap;gap:0"><i class="ti ti-file-invoice"></i> Órdenes de Trabajo (SAP)${total ? ` — ${done}/${total} (${pct}%)` : ''}${todayBadge}${pendingWOChips}</span>
      <span class="expand-btn">${S.showWO ? '▲ Cerrar' : '▼ Expandir'}</span>
    </div>`;

  if (S.showWO) {
    const ro = isSupervisor(); // técnico y admin = campos solo lectura
    const canTick = isTecView(); // técnico puede marcar checkboxes
    h += `<div class="ppl-mgmt-body">`;
    if (!ro) {
      h += `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <label class="btn btnb" style="cursor:pointer;font-size:16px">
          ⬆ Cargar Excel
          <input type="file" accept=".xlsx,.xls" style="display:none" onchange="handleWOFile(this)"/>
        </label>
        ${total ? `<button class="btn btng" style="font-size:16px" onclick="clearWorkOrders()"><i class="ti ti-trash" style="color:#ef4444"></i> Limpiar</button>` : ''}
        <span style="font-size:17px;color:var(--di)">Carga el reporte SAP. Solo se importan las OTs cuya fecha cae en la semana actual (${getWeekLabel(S.week)}).</span>
      </div>`;
    }

    if (!total) {
      h += `<div class="emsg">Sin órdenes de trabajo cargadas.${ro ? '' : ' Usa "Cargar Excel" para importar el reporte.'}</div>`;
    } else {
      const activeDays = getActiveDays(S.week);
      let grandExcel = 0, grandReal = 0;
      h += `<div style="display:flex;flex-direction:column;gap:14px">`;
      activeDays.forEach(({date: d, di: i}) => {
        const dayItems = (byDay[i] || []).map(id => ({ id, ...items[id] })).filter(x => x.ot !== undefined);
        const dname = (isTurno43(S.week)?DNAMES43:{})[i] || DNAMES[i];
        const dnum = `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}`;
        const dDone = dayItems.filter(x => x.done).length;
        const dExcel = dayItems.reduce((a,x)=>a+(parseFloat(x.hours)||0),0);
        const dReal = dayItems.reduce((a,x)=>{
          const rh = parseFloat(x.realHours);
          if (!isNaN(rh) && x.realHours !== '' && x.realHours !== null) return a + rh;
          if (x.done) return a + (parseFloat(x.hours)||0);
          return a;
        },0);
        const dPct = dExcel>0 ? Math.round(dReal/dExcel*100) : 0;
        grandExcel += dExcel; grandReal += dReal;
        const allDone = dayItems.length > 0 && dDone === dayItems.length;
        const noItems = dayItems.length === 0;
        const semColor = noItems ? '#64748b' : allDone ? '#22c55e' : '#ef4444';
        const semMsg = noItems ? 'Sin OTs este día' : allDone ? 'Todo Realizado' : 'Faltan Tareas por Realizar';
        h += `<div style="border:2px solid ${semColor};border-radius:10px;overflow:hidden">
          <div style="background:var(--s2);padding:8px 12px;display:flex;justify-content:space-between;align-items:center">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${semColor};box-shadow:0 0 8px ${semColor}88;flex-shrink:0"></span>
              <span style="font-weight:800;color:var(--cy);font-size:17px;letter-spacing:.5px">${dname} ${dnum}</span>
              <span style="font-size:16px;font-weight:700;color:${semColor}">${semMsg}</span>
            </div>
            <span style="font-size:17px;color:var(--di)">${dDone}/${dayItems.length} realizadas</span>
          </div>`;
        if (!dayItems.length) {
          h += `<div style="padding:10px 12px;font-size:16px;color:var(--di)">Sin OTs este día</div>`;
        } else {
          h += `<div style="overflow-x:auto"><table class="ppl-table" style="font-size:17px">
            <thead><tr>
              <th style="width:36px">✓</th><th style="width:110px">OT</th><th style="width:110px">Pauta</th><th>Descripción</th><th style="width:150px">Sortfield</th><th style="width:55px">Horas</th><th style="width:70px">Horas reales</th>${ro?'':'<th style="width:40px"></th>'}
            </tr></thead><tbody>`;
          dayItems.forEach(it => {

function removeOS(osId) {

// Inserta una lista de registros OS {responsable,tipoEquipo,...,_fecha:Date} en el panel
function _commitOSRecords(records) {
  const weekDays = getWeekDays(S.week);
  const dateToDi = {};
  weekDays.forEach((d, i) => { dateToDi[`${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`] = i; });

  const w = wd();
  const op = JSON.parse(JSON.stringify(w.osPanel || { items: {}, byDay: {} }));
  if (!op.items) op.items = {};
  if (!op.byDay) op.byDay = {};

  let added = 0, skipped = 0;
  records.forEach((rec, idx) => {
    const dt = rec._fecha;
    if (!(dt instanceof Date) || isNaN(dt)) { skipped++; return; }
    const di = dateToDi[`${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`];
    if (di === undefined) { skipped++; return; }
    const osId = `os_${idx}_${Date.now().toString(36)}`;
    op.items[osId] = {
      responsable: rec.responsable || 'N/A',
      tipoEquipo: rec.tipoEquipo || 'N/A',
      modelo: rec.modelo || 'N/A',
      serie: rec.serie || 'N/A',
      area: rec.area || 'N/A',
      tag: rec.tag || 'N/A',
      pauta: rec.pauta || 'N/A',
      numeroOS: rec.numeroOS || '',
      nota: '', done: false,
    };
    if (!op.byDay[di]) op.byDay[di] = [];
    op.byDay[di].push(osId);
    added++;
  });

  if (added === 0) {
    alert(`No se agregó ninguna actividad.\nNinguna fecha coincide con la semana actual (${getWeekLabel(S.week)}).\nUbícate en la semana correcta antes de cargar.`);
    return;
  }
  swd({ osPanel: op });
  alert(`✅ ${added} actividades OS cargadas.${skipped ? `\n(${skipped} omitidas por estar fuera de la semana o sin fecha válida)` : ''}`);
}

// Parsea fecha dd-mm-aaaa o dd/mm/aaaa
function _parseOSDate(str) {
  const m = String(str).trim().match(/(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
  if (!m) return null;
  return new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
}

// Carga desde texto pegado (formato posicional)
function loadOSFromText() {
  const ta = document.getElementById('os-paste-area');
  if (!ta) return;
  const raw = ta.value;
  if (!raw.trim()) { alert('Pega el texto de las actividades primero.'); return; }

  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const FIELDS = ['tipoEquipo','modelo','serie','area','tag','pauta']; // orden estándar tras fecha/responsable
  const records = [];
  let current = null;
  let fieldIdx = 0;

  lines.forEach(line => {
    const dateMatch = line.match(/(\d{1,2}[-/]\d{1,2}[-/]\d{4})\s*\/?\s*(.*)/);
    if (dateMatch && _parseOSDate(dateMatch[1])) {
      // Nuevo bloque
      if (current) records.push(current);
      current = { _fecha: _parseOSDate(dateMatch[1]), responsable: (dateMatch[2]||'').trim() || 'N/A' };
      fieldIdx = 0;
    } else if (current) {
      if (fieldIdx < FIELDS.length) {
        const fieldName = FIELDS[fieldIdx];
        if (fieldName === 'pauta') {
          // Si la línea de pauta tiene un número al final, separarlo como N° OS
          const pautaMatch = line.match(/^(.+?)\s+(\d{6,})\s*$/);
          if (pautaMatch) {
            current['pauta'] = pautaMatch[1].trim();
            current['numeroOS'] = pautaMatch[2].trim();
          } else {
            current['pauta'] = line;
          }
        } else {
          current[FIELDS[fieldIdx]] = line;
        }
        fieldIdx++;
      } else {
        // Línea extra tras pauta: si es solo número, asignar a numeroOS
        if (!current['numeroOS'] && /^\d{6,}$/.test(line.trim())) {
          current['numeroOS'] = line.trim();
        }
      }
    }
  });
  if (current) records.push(current);

  if (!records.length) {
    alert('No se detectó ningún bloque válido.\nCada bloque debe empezar con una línea tipo "27-05-2026 / Nombre".');
    return;
  }
  _commitOSRecords(records);
  ta.value = '';
  S.showOSPaste = false;
}
window.loadOSFromText = loadOSFromText;

window.toggleOSPaste = toggleOSPaste;

// Carga desde Excel (orden de columnas estándar; encabezados flexibles)
function handleOSFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
      if (!rows.length) { alert('El archivo está vacío.'); return; }

      const header = rows[0].map(h => String(h || '').trim().toLowerCase());
      // Buscar columnas por nombre aproximado
      const find = (...names) => {
        for (const n of names) { const idx = header.findIndex(h => h.includes(n)); if (idx >= 0) return idx; }
        return -1;
      };
      const cFecha = find('fecha','startdate','date');
      const cResp  = find('responsable','ejecutante','nombre');
      const cEquipo= find('equipo','tipo');
      const cModelo= find('modelo');
      const cSerie = find('serie','serial');
      const cArea  = find('area','área','ubicaci');
      const cTag   = find('tag','etiqueta');
      const cPauta = find('pauta','actividad','tarea');
      const cNumOS = find('n° os','numero os','nro os','n.os','os_num','os num');
      if (cFecha < 0) { alert('No se encontró la columna de Fecha en el Excel.'); return; }

      const records = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || row[cFecha] == null) continue;
        let dt = row[cFecha];
        if (!(dt instanceof Date)) dt = _parseOSDate(dt) || new Date(dt);
        records.push({
          _fecha: dt,
          responsable: cResp>=0 ? String(row[cResp]??'').trim() : '',
          tipoEquipo: cEquipo>=0 ? String(row[cEquipo]??'').trim() : '',
          modelo: cModelo>=0 ? String(row[cModelo]??'').trim() : '',
          serie: cSerie>=0 ? String(row[cSerie]??'').trim() : '',
          area: cArea>=0 ? String(row[cArea]??'').trim() : '',
          tag: cTag>=0 ? String(row[cTag]??'').trim() : '',
          pauta: cPauta>=0 ? String(row[cPauta]??'').trim() : '',
          numeroOS: cNumOS>=0 ? String(row[cNumOS]??'').trim() : '',
        });
      }
      _commitOSRecords(records);
    } catch (err) {
      alert('Error al leer el archivo: ' + err.message);
    } finally {
      input.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}
window.handleOSFile = handleOSFile;

function renderOSPanel() {
  const w = wd();
  const op = w.osPanel || { items: {}, byDay: {} };
  const items = op.items || {};
  const byDay = op.byDay || {};
  const total = Object.keys(items).length;
  const done = Object.values(items).filter(i => i.done).length;
  const pct = total > 0 ? Math.round(done/total*100) : 0;

  // Estado del día actual
  const now = new Date();
  const todayUTC = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const activeDaysOS = getActiveDays(S.week);
  let todayDiOS = activeDaysOS.findIndex(({date:d}) => d.getTime() === todayUTC.getTime());
  if (todayDiOS < 0) todayDiOS = 0;
  const todayIdxOS = activeDaysOS[todayDiOS]?.di ?? 0;
  const todayOSItems = (byDay[todayIdxOS] || []).map(id => ({id, ...items[id]})).filter(x => x.responsable !== undefined);
  // Días pasados sin tickear
  const pastUnmarked = activeDaysOS.filter(({date:d, di:i}) => {
    if (d.getTime() >= todayUTC.getTime()) return false;
    const dayItems = (byDay[i] || []).map(id => ({id, ...items[id]})).filter(x => x.responsable !== undefined);
    if (dayItems.length === 0) return false;
    return !dayItems.every(x => x.done);
  });

  // Badge de hoy
  let osTodayBadge = '';
  if (total > 0) {
    const todayDate = `${String(todayUTC.getUTCDate()).padStart(2,'0')}/${String(todayUTC.getUTCMonth()+1).padStart(2,'0')}/${todayUTC.getUTCFullYear()}`;
    if (todayOSItems.length === 0) {
      osTodayBadge = `<span style="font-size:17px;color:#64748b;margin-left:10px">⬜ Sin actividades OS hoy</span>`;
    } else {
      const allDoneOS = todayOSItems.every(x => x.done);
      osTodayBadge = allDoneOS
        ? `<span style="font-size:17px;color:#22c55e;font-weight:700;margin-left:10px"><i class="ti ti-circle-check" style="color:#22c55e"></i> LAS HORAS DE HOY ${todayDate} YA SE CARGARON</span>`
        : `<span style="font-size:17px;color:#ef4444;font-weight:700;margin-left:10px"><i class="ti ti-alert-circle" style="color:#ef4444"></i> HORAS DE HOY ${todayDate} AÚN NO SE CARGAN</span>`;
    }
  }
  // Badge de días pasados sin marcar
  let osPastBadge = '';
  if (pastUnmarked.length > 0) {
    const labels = pastUnmarked.map(({date:d, di:i}) => {
      const dn = (isTurno43(S.week)?DNAMES43:{})[i]||DNAMES[i]||'?';
      return `${dn} ${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}`;
    }).join(', ');
    osPastBadge = `<span style="font-size:17px;color:#f59e0b;font-weight:700;margin-left:16px"><i class="ti ti-alert-triangle" style="color:#f59e0b"></i> HORAS SIN MARCAR: ${labels}</span>`;
  }
  const osBadge = osTodayBadge + osPastBadge;

  // Chips OS pendientes del día activo (solo pendientes, con parpadeo)
  const todayOSPending = (byDay[todayIdxOS]||[]).map(id=>({id,...items[id]})).filter(x=>!x.done);
  const pendingOSChips = todayOSPending
    .map(it => `<button class="chip-pending" style="margin-left:6px" onclick="event.stopPropagation();expandAndHlRow('os','os-row-${it.id}')" title="${esc(it.tipoEquipo||'')} ${esc(it.tag||it.serie||'')}">${esc(it.responsable||'—')}</button>`)
    .join('');

  let h = `<div class="ppl-mgmt" style="margin-top:14px">
    <div class="ppl-mgmt-hdr" onclick="toggleOS()">
      <span class="lbl" style="font-size:17px;display:inline-flex;align-items:center;flex-wrap:wrap;gap:0"><i class="ti ti-tool"></i> OS — Actividades de Equipos${total ? ` — ${done}/${total} (${pct}%)` : ''}${osBadge}${pendingOSChips}</span>
      <span class="expand-btn">${S.showOS ? '▲ Cerrar' : '▼ Expandir'}</span>
    </div>`;

  if (S.showOS) {
    const total2 = total;
    const ro = isSupervisor();
    const canTick = isTecView();
    h += `<div class="ppl-mgmt-body">`;
    if (!ro) {
      h += `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <label class="btn btnb" style="cursor:pointer;font-size:16px">
          ⬆ Cargar Excel
          <input type="file" accept=".xlsx,.xls" style="display:none" onchange="handleOSFile(this)"/>
        </label>
        <button class="btn btnb" style="font-size:16px" onclick="toggleOSPaste()"><i class="ti ti-clipboard-text"></i> ${S.showOSPaste ? "Ocultar" : "Pegar texto"}</button>
        ${total2 ? `<button class="btn btng" style="font-size:16px" onclick="clearOSPanel()"><i class="ti ti-trash" style="color:#ef4444"></i> Limpiar</button>` : ''}
        <span style="font-size:17px;color:var(--di)">Solo se cargan actividades de la semana actual (${getWeekLabel(S.week)}).</span>
      </div>`;
    }
    if (!ro && S.showOSPaste) {
      h += `<div style="margin-bottom:14px;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:12px">
        <div style="font-size:17px;color:var(--di);margin-bottom:6px;line-height:1.5">
          Pega los bloques. Cada bloque empieza con <b style="color:var(--cy)">fecha / responsable</b> y luego, en orden: equipo, modelo, serie, área, tag, pauta. Lo que falte queda como N/A.
        </div>

function jumpUpdate() {

  const weekSel = document.getElementById('jump-week');
  if (!weekSel) return;
  // Rebuild week options for selected year+month
  const weeksForYM = [
    ...getYearWeeks(yr - 1),
    ...getYearWeeks(yr),
    ...getYearWeeks(yr + 1),
  ].filter(wn2 => {
    const d2 = getWeekDays(wn2);
    return d2[2].getUTCFullYear() === yr && d2[2].getUTCMonth() === mo;
  });
  weekSel.innerHTML = weeksForYM.map(wn2 => {
    const d2 = getWeekDays(wn2);
    const iso2 = getISOWeek(d2[2]);
    return `<option value="${wn2}">W${String(iso2).padStart(2,'0')} · ${d2[0].getUTCDate()}→${d2[6].getUTCDate()}</option>`;
  }).join('') || `<option value="">Sin semanas</option>`;
}

function countPendingToday() {
  return getPendingTodayDetails().count;
}

function getPendingTodayDetails() {
  const now = new Date();
  const todayUTC = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const days = getWeekDays(S.week);
  const di = days.findIndex(d => d.getTime() === todayUTC.getTime());
  if (di < 0) return { count: 0, items: [] };
  const w = wd();
  let count = 0;
  // taskLabel → Set of person names pending
  const byTask = {};
  function checkTask(taskId, taskLabel, defaultPpl) {
    const filteredDefault = (defaultPpl || []).filter(p => LISTS.personal.includes(p));
    const assignedPpl = getDayTaskPeople(di, taskId, filteredDefault).filter(p => LISTS.personal.includes(p));
    const effective = resolveEffectivePeople(di, assignedPpl)
      .filter(e => !e.isReplacement || !isRepExcludedFromTask(di, taskId, e.name));
    effective.forEach(e => {
      const dta = getDT(di, taskId, e.name);
      if (!dta.done) {
        count++;
        if (!byTask[taskLabel]) byTask[taskLabel] = new Set();
        byTask[taskLabel].add(e.name);
      }
    });
  }
  DFLT.forEach(dt => {
    if (dt.sub.length) getSubs(dt.id, dt).forEach(s => checkTask(`${dt.id}__${s.id}`, `${dt.label} › ${s.label}`, s.people || (w.people||[])));
    else checkTask(dt.id, dt.label, (w.people||[]));
  });
  (w.customTasks || []).forEach(ct => {
    if (ct.dias && ct.dias.length > 0 && !ct.dias.includes(di)) return;
    if ((ct.sub||[]).length) (ct.sub||[]).forEach(s => checkTask(`${ct.id}__${s.id}`, `${ct.label} › ${s.label}`, s.people||(w.people||[])));
    else checkTask(ct.id, ct.label, ct.people||(w.people||[]));
  });
  const items = Object.entries(byTask).map(([label, ppl]) => ({ label, people: [...ppl] }));
  return { count, items };
}

      const assignedPpl = getDayTaskPeople(di, taskId, filteredDefault).filter(p => LISTS.personal.includes(p));
      const effective = resolveEffectivePeople(di, assignedPpl)
        .filter(e => !e.isReplacement || !isRepExcludedFromTask(di, taskId, e.name));
      effective.forEach(e => {
        if (!getDT(di, taskId, e.name).done) {
          count++;
          const key = `${dayName} · ${taskLabel}`;
          if (!byEntry[key]) byEntry[key] = new Set();
          byEntry[key].add(e.name);
        }
      });
    }
    DFLT.forEach(dt => {
      if (dt.sub.length) getSubs(dt.id, dt).forEach(s => checkTask(`${dt.id}__${s.id}`, `${dt.label} › ${s.label}`, s.people||(w.people||[])));
      else checkTask(dt.id, dt.label, (w.people||[]));
    });
    (w.customTasks || []).forEach(ct => {
      if (ct.dias && ct.dias.length > 0 && !ct.dias.includes(di)) return;
      if ((ct.sub||[]).length) (ct.sub||[]).forEach(s => checkTask(`${ct.id}__${s.id}`, `${ct.label} › ${s.label}`, s.people||(w.people||[])));
      else checkTask(ct.id, ct.label, ct.people||(w.people||[]));
    });
  }
  const items = Object.entries(byEntry).map(([label, ppl]) => ({ label, people: [...ppl] }));
  return { count, items };
}

let _swReg = null; // referencia al SW registrado

async function registerSW() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    _swReg = reg;
    return reg;
  } catch(err) {
    console.warn('SW no disponible:', err.message);
    return null;
  }
}

function swPostMessage(msg) {
  if (!_swReg || !_swReg.active) return false;
  _swReg.active.postMessage(msg);
  return true;
}

// Calcular ms hasta la próxima hora:minuto del día
function msUntil(targetHour, targetMin = 0) {
  const now = new Date();
  const target = new Date();
  target.setHours(targetHour, targetMin, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  return target.getTime() - now.getTime();
}

// Programar notificaciones para hoy en el SW
function scheduleNotificationsInSW() {
  if (!_swReg) return;

  const now = new Date();
  const dow = now.getDay(); // 0=Dom,1=Lun,...
  const dateKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
  const sent = JSON.parse(sessionStorage.getItem(NOTIF_KEY) || '{}');
  const es43 = isTurno43(S.week);

  if (es43) {
    // ── Turno 4-3: Jueves 13:00 → cierre de semana ───────────────────────────
    if (dow === 4 && !sent[`week_${dateKey}`]) {
      const delay = msUntil(13, 0);
      if (delay < 24 * 60 * 60 * 1000) {
        swPostMessage({
          type: 'SCHEDULE_NOTIF',
          payload: {
            id: `week_${dateKey}`,
            title: '📋 Cierre de semana (Turno 4-3)',
            body: 'Revisa que todas las tareas de la semana estén completadas.',
            delayMs: delay,
            icon: 'https://cdn-icons-png.flaticon.com/512/1827/1827422.png',
          }
        });
      }
    } else {
      swPostMessage({ type: 'CANCEL_NOTIF', payload: { id: `week_${dateKey}` } });
    }
    // ── Turno 4-3: Lun-Mié 19:00 → fin de turno diario ──────────────────────
    if ([1,2,3].includes(dow) && !sent[`day_${dateKey}`]) {
      const delay = msUntil(19, 0);
      if (delay < 24 * 60 * 60 * 1000) {
        swPostMessage({
          type: 'SCHEDULE_NOTIF',
          payload: {
            id: `day_${dateKey}`,
            title: '⏰ Fin de turno',
            body: 'Revisa las tareas pendientes antes de cerrar el día.',
            delayMs: delay,
            icon: 'https://cdn-icons-png.flaticon.com/512/1827/1827422.png',
          }
        });
      }
    } else {
      swPostMessage({ type: 'CANCEL_NOTIF', payload: { id: `day_${dateKey}` } });
    }
  } else {
    // ── Turno 2-4 / 1-3: Lunes 16:00 → cierre semana ────────────────────────
    if (dow === 1 && !sent[`week_${dateKey}`]) {
      const delay = msUntil(16, 0);
      if (delay < 24 * 60 * 60 * 1000) {
        swPostMessage({
          type: 'SCHEDULE_NOTIF',
          payload: {
            id: `week_${dateKey}`,
            title: '📋 Cierre de semana',
            body: 'Revisa que todas las tareas de la semana estén completadas.',
            delayMs: delay,
            icon: 'https://cdn-icons-png.flaticon.com/512/1827/1827422.png',
          }
        });
      }
    } else {
      swPostMessage({ type: 'CANCEL_NOTIF', payload: { id: `week_${dateKey}` } });
    }
    // ── Mar–Dom 19:00 → fin de turno diario ──────────────────────────────────
    if (dow !== 1 && !sent[`day_${dateKey}`]) {
      const delay = msUntil(19, 0);
      if (delay < 24 * 60 * 60 * 1000) {
        swPostMessage({
          type: 'SCHEDULE_NOTIF',
          payload: {
            id: `day_${dateKey}`,
            title: '⏰ Fin de turno',
            body: 'Revisa las tareas pendientes antes de cerrar el día.',
            delayMs: delay,
            icon: 'https://cdn-icons-png.flaticon.com/512/1827/1827422.png',
          }
        });
      }
    } else {
      swPostMessage({ type: 'CANCEL_NOTIF', payload: { id: `day_${dateKey}` } });
    }
  }
}

// Verificar pendientes y mostrar modal si ya pasó la hora (fallback sin SW)
function checkNotifications() {
  const now = new Date();
  const dow = now.getDay();
  const hh  = now.getHours();
  const dateKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
  const sent = JSON.parse(sessionStorage.getItem(NOTIF_KEY) || '{}');
  const es43 = isTurno43(S.week);

  if (es43) {
    // Turno 4-3: cierre semana jueves 13:00
    if (dow === 4 && !sent[`week_${dateKey}`] && hh >= 13) {
      const { count: pending, items } = getPendingWeekDetails();
      if (pending > 0) {
        showModalAlert('Cierre de semana (Turno 4-3)',
          `Faltan <b style="font-size:20px">${pending}</b> tarea${pending>1?'s':''} por completar esta semana.`, items);
        sent[`week_${dateKey}`] = true;
        sessionStorage.setItem(NOTIF_KEY, JSON.stringify(sent));
      }
    }
    // Turno 4-3: fin de día lun-mié 19:00
    if ([1,2,3].includes(dow) && !sent[`day_${dateKey}`] && hh >= 19) {
      const { count: pending, items } = getPendingTodayDetails();
      if (pending > 0) {
        showModalAlert('Fin de turno',
          `Faltan <b style="font-size:20px">${pending}</b> tarea${pending>1?'s':''} por completar hoy.`, items);
        sent[`day_${dateKey}`] = true;
        sessionStorage.setItem(NOTIF_KEY, JSON.stringify(sent));
      }
    }
  } else {
    // Turno 2-4 / 1-3: cierre semana lunes 16:00
    if (dow === 1 && !sent[`week_${dateKey}`] && hh >= 16) {
      const { count: pending, items } = getPendingWeekDetails();
      if (pending > 0) {
        showModalAlert('Cierre de semana',
          `La página se abrió después de las 16:00.<br>Faltan <b style="font-size:20px">${pending}</b> tarea${pending>1?'s':''} por completar esta semana.`, items);
        sent[`week_${dateKey}`] = true;
        sessionStorage.setItem(NOTIF_KEY, JSON.stringify(sent));
      }
    }
    // Fin de día mar-dom 19:00
    if (dow !== 1 && !sent[`day_${dateKey}`] && hh >= 19) {
      const { count: pending, items } = getPendingTodayDetails();
      if (pending > 0) {
        showModalAlert('Fin de turno',
          `La página se abrió después de las 19:00.<br>Faltan <b style="font-size:20px">${pending}</b> tarea${pending>1?'s':''} por completar hoy.`, items);
        sent[`day_${dateKey}`] = true;
        sessionStorage.setItem(NOTIF_KEY, JSON.stringify(sent));
      }
    }
  }
}

// Cuando el SW dispara la notificación, marcar como enviada y cancelar el modal
function onSWNotificationSent(id) {
  const sent = JSON.parse(sessionStorage.getItem(NOTIF_KEY) || '{}');
  sent[id] = true;
  sessionStorage.setItem(NOTIF_KEY, JSON.stringify(sent));
}

async function initNotifications() {
  if (!('Notification' in window)) return;

  // Pedir permiso si no está decidido
  if (Notification.permission === 'default') {
    await Notification.requestPermission();
  }

  if (Notification.permission !== 'granted') return;

  // Registrar Service Worker
  await registerSW();

  // Escuchar mensajes del SW (confirmación de notificación enviada)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data?.type === 'NOTIF_SENT') onSWNotificationSent(e.data.id);
    });
  }

  // Programar notificaciones en el SW para hoy
  scheduleNotificationsInSW();

  // Reprogramar cada día a medianoche
  const msToMidnight = msUntil(0, 1);
  setTimeout(() => {
    scheduleNotificationsInSW();
    setInterval(scheduleNotificationsInSW, 24 * 60 * 60 * 1000);
  }, msToMidnight);

  // Fallback: checkeo local al iniciar (por si abrió tarde)
  const waitForSync = setInterval(() => {
    if (S.synced) { clearInterval(waitForSync); checkNotifications(); }
  }, 500);
}

if (_alreadyAuth) {

} else {

  (function() {

      const r = JSON.parse(localStorage.getItem('workcal_remember') || 'null');

        // Aplicar flags de sesión
        const f = r.flags;
        sessionStorage.setItem('workcal_auth', '1');
        f.sup  ? sessionStorage.setItem('workcal_supervisor','1') : sessionStorage.removeItem('workcal_supervisor');
        f.t43  ? sessionStorage.setItem('workcal_t43','1')        : sessionStorage.removeItem('workcal_t43');
        f.tec  ? sessionStorage.setItem('workcal_tecnico','1')    : sessionStorage.removeItem('workcal_tecnico');
        f.adm  ? sessionStorage.setItem('workcal_admin','1')      : sessionStorage.removeItem('workcal_admin');
        // Ocultar lock-screen y lanzar app
        const ls = document.getElementById('lock-screen');
        const app = document.getElementById('app');
        if (ls) ls.style.display = 'none';
        if (app) app.style.display = 'block';
        window.initApp();
      }
    } catch(e) {}
  })();
}

<script>
(function(){
  // Create FAB programmatically to ensure it's always in body
  const fab = document.createElement('button');
  fab.id = 'scroll-top-fab';
  fab.title = 'Volver arriba';
  fab.innerHTML = '<i class="ti ti-arrow-up"></i>';
  fab.onclick = function(){ window.scrollTo({top:0,behavior:'smooth'}); document.documentElement.scrollTop=0; document.body.scrollTop=0; };
  document.body.appendChild(fab);

  // FAB scroll-to-top visibility
  function checkFabVisibility(){
    const sy = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    const anyExpanded = (window.S && (window.S.showWO || window.S.showOS));
    if (sy > 80 && anyExpanded) fab.classList.add('visible');
    else fab.classList.remove('visible');
  }
  window.addEventListener('scroll', checkFabVisibility, {passive: true});
  // Re-check when panels expand/collapse
  window._checkFab = checkFabVisibility;

  function fixSpacer(){
    const s=document.getElementById('sticky-shell');
    const p=document.getElementById('sticky-spacer');
    if(s&&p) p.style.height=s.getBoundingClientRect().height+'px';
  }
  // Run on every animation frame until stable, then on resize
  let last=0,count=0;
  function loop(){
    fixSpacer();
    const h=document.getElementById('sticky-shell')?.getBoundingClientRect().height||0;
    if(h!==last){last=h;count=0;}
    if(count++<30) requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.addEventListener('resize',fixSpacer);
  new MutationObserver(fixSpacer).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
})();
</script>
