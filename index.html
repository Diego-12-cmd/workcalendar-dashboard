<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard Operacional</title>
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src  'self' 'unsafe-inline' 'unsafe-eval'
              https://cdnjs.cloudflare.com
              https://www.gstatic.com
              https://*.firebaseapp.com;
  style-src   'self' 'unsafe-inline'
              https://fonts.googleapis.com
              https://cdn.jsdelivr.net;
  font-src    https://fonts.gstatic.com
              https://cdn.jsdelivr.net;
  connect-src https://*.googleapis.com
              https://*.firebaseio.com
              https://firestore.googleapis.com
              https://*.firebaseapp.com
              wss://*.firebaseio.com
              wss://*.googleapis.com;
  img-src     'self' data:
              https://cdn-icons-png.flaticon.com;
  worker-src  blob: 'self';
  child-src   blob: 'self';
"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── TABLER ICON BADGES ── */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow-x:hidden;background:#050d1a;}
.sticky-shell{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);padding:8px 8px 0;}
@media(max-width:768px){
  .sticky-shell{position:relative;top:auto;left:auto;right:auto;z-index:auto;}
  #sticky-spacer{display:none !important;}
}
:root{
  --bg:#050d1a;--s1:#0b1426;--s2:#0f172a;--s3:#0a1628;
  --b1:#1e293b;--b2:#1e3a5f;--b3:#334155;
  --tx:#f1f5f9;--mu:#cbd5e1;--di:#94a3b8;--dm:#1e3a5f;
  --bl:#3b82f6;--bld:#1d4ed8;--blb:#1e3a5f;
  --gn:#22c55e;--gnd:#166534;--gnb:#042b1a;
  --am:#f59e0b;--pu:#a855f7;--cy:#7dd3fc;--rd:#ef4444;
  --rep-bg:#422006;--rep-tx:#f59e0b;
}
/* ── TEMA CLARO ──────────────────────────────── */
body.light{
  --bg:#f0f4f8;--s1:#ffffff;--s2:#f1f5f9;--s3:#e2e8f0;
  --b1:#cbd5e1;--b2:#93c5fd;--b3:#94a3b8;
  --tx:#0f172a;--mu:#334155;--di:#64748b;--dm:#bfdbfe;
  --bl:#2563eb;--bld:#1d4ed8;--blb:#dbeafe;
  --gn:#16a34a;--gnd:#14532d;--gnb:#dcfce7;
  --am:#d97706;--pu:#9333ea;--cy:#0284c7;--rd:#dc2626;
  --rep-bg:#fff7ed;--rep-tx:#c2410c;
}
/* Las transiciones de tema se aplican solo durante el cambio — ver toggleTheme() */
/* overrides claro para elementos hardcoded */
body.light .ditem{background:#f8fafc;border-color:#e2e8f0;}
body.light .ditem.done{background:#f0fdf4;border-color:#bbf7d0;}
body.light .dexp{background:#f1f5f9;border-top-color:#e2e8f0;}
body.light .aform{background:#f8fafc;border-color:#cbd5e1;}
body.light .task-custom-row{background:#f8fafc;border-color:#cbd5e1;}
body.light .add-ppl-dropdown{background:#ffffff;border-color:#94a3b8;}
body.light .day-notes{background:#eff6ff;border-color:#93c5fd;}
body.light .day-notes textarea{color:#334155;}
body.light .prog-bar{background:#e2e8f0;}
body.light .prog-wrap{background:rgba(0,0,0,.04);border-bottom-color:#e2e8f0;}
body.light .dtask-item[data-tid="cierreot"] .dtask-name{background:rgba(139,92,246,.08);}
body.light .dtask-item[data-tid="ert2"] .dtask-name{background:rgba(6,182,212,.07);}
body.light .dtask-item[data-tid="yd0"] .dtask-name{background:rgba(239,68,68,.07);}
body.light .dcol.today .dhdr{background:#dbeafe;}
body.light .dcol.past .dhdr{background:#f1f5f9;}
body.light .dcol.today .dnum{color:#2563eb;}
body.light .dcol.past .dnum{color:#94a3b8;}
body.light .ppl-mgmt-hdr:hover{background:#f1f5f9;}
body.light .task-panel-hdr:hover{background:#f1f5f9;}
body.light .dcol.today{background:#eff6ff;border-color:#2563eb;}
body.light .dcol.today .dnum{color:#2563eb;}
body.light mark{background:#1d4ed8;color:#fff;}
body.light .dtask-item{background:#f8fafc;}
body.light .dtask-item.task-highlight{border-color:#d97706 !important;border-width:2px !important;background:#fef3c7 !important;animation:taskPulse .7s ease 4;}
body.light .dtask-prow:hover{background:#e2e8f0;}
/* Transición de tema — solo activa durante el cambio */
.theme-transitioning,
.theme-transitioning *{transition:background-color .2s,border-color .2s,color .15s !important;}
/* botón toggle */
.theme-btn{border:1px solid var(--b3);border-radius:8px;padding:6px 12px;font-size:17px;font-weight:700;background:var(--s2);color:var(--mu);display:flex;align-items:center;gap:6px;}
.theme-btn:hover{border-color:var(--bl);color:var(--tx);}
body{background:var(--bg);color:var(--tx);font-family:'Barlow',sans-serif;min-height:100vh;padding:8px;}
input,textarea,select,button{font-family:'Barlow',sans-serif;}
button{cursor:pointer;}
#app{max-width:1600px;margin:0 auto;}

/* HEADER */
.hdr{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:8px;border-bottom:1px solid var(--b1);padding-bottom:14px;}
.hdr-l{flex:1;min-width:160px;}
.wk-title{font-size:22px;font-weight:900;letter-spacing:-0.5px;}
.wk-title b{color:var(--bl);}
.lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--di);}

/* BADGE */
.bdg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap;}

/* PERSON BAR */
/* TASK MGMT */
.task-panel{background:var(--s1);border-radius:12px;border:1px solid var(--b1);margin-bottom:14px;overflow:hidden;}
.task-panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;}
.task-panel-hdr:hover{background:var(--s2);}
.task-panel-body{padding:12px 14px;border-top:1px solid var(--b1);}
.task-section{margin-bottom:12px;}
.task-section-lbl{font-size:17px;color:var(--di);letter-spacing:2px;font-weight:700;text-transform:uppercase;margin-bottom:8px;}
.task-fixed-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid var(--b1);}
.task-fixed-row:last-child{border-bottom:none;}
.task-fixed-name{font-size:17px;color:var(--mu);font-weight:700;}
.task-sub-chip{background:var(--blb);color:var(--cy);border-radius:10px;padding:2px 8px;font-size:17px;font-weight:600;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--b2);}
body.light .task-sub-chip{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd;}
.badge-fija{background:var(--gnb);color:var(--gn);border:1px solid var(--gnd)44;font-size:16px;display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;}
body.light .badge-fija{background:#dcfce7;color:#15803d;border-color:#86efac;}
.task-custom-row{background:var(--s2);border-radius:8px;padding:7px 10px;margin-bottom:6px;border:1px solid var(--b1);}
.task-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px;}

/* DELETE */
.del-btn{background:none;border:1px solid var(--b3);border-radius:6px;color:var(--di);font-size:16px;padding:2px 8px;}
.del-btn:hover{border-color:var(--rd);color:var(--rd);}

/* DAY GRID */
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
@media(max-width:960px){.dgrid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:600px){.dgrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:768px){
  /* Grid de días: scroll horizontal, una columna por día */
  .dgrid{display:flex;overflow-x:auto;gap:8px;padding-bottom:6px;scrollbar-width:none;flex-wrap:nowrap;}
  .dgrid::-webkit-scrollbar{display:none;}
  body{overflow-x:hidden;}
  .dgrid{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -8px;width:100vw;overflow-x:scroll;}
  .dcol{flex:0 0 100vw;width:100vw;min-width:100vw;scroll-snap-align:start;scroll-snap-stop:always;padding:4px 8px;box-sizing:border-box;}
  /* Day text sizes */
  .dday{font-size:16px !important;}
  .dnum{font-size:52px !important;letter-spacing:-2px;}
  .dtask-title{font-size:16px !important;font-weight:700;}
  .dtask-pname{font-size:16px !important;}
  .dtask-ttl{font-size:13px !important;}
  /* Stepper larger */
  .qty-stepper{height:34px !important;}
  .qty-stepper button{width:34px !important;font-size:20px !important;}
  .qty-stepper span{font-size:18px !important;min-width:24px !important;}
  .qty-stepper input{width:36px !important;font-size:16px !important;}
  /* Checkbox larger */
  .dtask-prow input[type=checkbox]{width:24px !important;height:24px !important;}
  /* Del button larger */
  .del-btn{width:34px !important;height:34px !important;font-size:17px !important;}
  /* Task block more padding */
  .dtask-item{padding:10px 12px !important;margin-bottom:8px !important;border-radius:10px !important;}
  .dtask-prow{padding:6px 3px !important;}
  /* Dots larger */
  .dcol .status-dots span{width:11px !important;height:11px !important;}
  /* Resumen semana: compacto en mobile */
  .resumen-mobile{display:block!important;}
  .resumen-desktop{display:none!important;}
  /* Chips en activos esta semana: wrap correctamente */
  .ppl-f-chips{flex-wrap:wrap!important;padding-left:20px;}
}
.dcol{background:var(--s1);border-radius:10px;border:1px solid var(--b1);padding:4px;min-width:0;}
.dcol.today{background:#0c1e36;border-color:var(--bl);box-shadow:0 0 0 1px rgba(59,130,246,.25);}
.dnum{font-size:22px;font-weight:900;line-height:1;margin-top:2px;letter-spacing:-.5px;}
.dcol.today .dnum{color:var(--bl);}
.dcol.past .dnum{color:#475569;}
.dcol.past{opacity:.9;}
.dcol:not(.today):not(.past) .dnum{color:var(--tx);}
.dhdr{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 10px 7px;margin-bottom:0;}
.dcol.today .dhdr{background:#1e3a5f;}
.dcol.past .dhdr{background:#1a1f2e;}
.dcol:not(.today):not(.past) .dhdr{background:var(--s1);}

/* YO DETENGO */
/* DAY ITEMS */
.ditem{background:var(--s2);border-radius:6px;border:1px solid var(--b1);padding:3px 5px;margin-bottom:3px;}
.ditem.done{background:var(--gnb);border-color:#14532d;}
.dirow{display:flex;align-items:flex-start;gap:6px;}
.deq{color:var(--tx);font-weight:700;font-size:13px;word-break:break-word;}
.deq.done{color:var(--gnd);text-decoration:line-through;}
.dsub{color:var(--di);font-size:12px;}
.dexp{background:var(--s3);border-radius:6px;margin-top:8px;padding:8px;border-top:1px solid var(--b1);}
/* TASK SECTIONS separators — colores por ID de tarea */
.dtask-item{border-radius:7px;overflow:hidden;margin-bottom:5px;border:none;background:transparent;}
.dtask-name{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;display:flex;align-items:center;gap:5px;border-left:2px solid #475569;background:rgba(255,255,255,.04);color:var(--di);}
/* cierre OTs = violeta */
.dtask-item[data-tid="cierreot"] .dtask-name,.dtask-item[data-tid^="cierreot__"] .dtask-name{background:rgba(139,92,246,.14);color:#a78bfa;border-left-color:#8b5cf6;}
/* ERT2 = cyan */
.dtask-item[data-tid="ert2"] .dtask-name,.dtask-item[data-tid^="ert2__"] .dtask-name{background:rgba(6,182,212,.1);color:#67e8f9;border-left-color:#06b6d4;}
/* Yo Detengo = rojo */
.dtask-item[data-tid="yd0"] .dtask-name{background:rgba(239,68,68,.1);color:#fca5a5;border-left-color:#ef4444;}
/* custom/flex = ambar */
.dtask-item[data-tid^="flex"] .dtask-name,.dtask-item[data-tid^="custom"] .dtask-name{background:rgba(245,158,11,.1);color:#fcd34d;border-left-color:#f59e0b;}
.dtask-prow{background:rgba(255,255,255,.025);border-radius:0;padding:3px 8px;}
.dtask-prow:hover{background:rgba(255,255,255,.05);}

/* INPUTS */
.inp{width:100%;background:var(--s3);border:1px solid var(--b2);border-radius:8px;color:var(--mu);padding:5px 10px;font-size:17px;outline:none;margin-bottom:4px;}
.inp:focus{border-color:var(--bl);}
textarea.inp{resize:none;}
.arow{display:flex;gap:6px;margin-top:6px;}
.arow .inp{margin-bottom:0;}
.btn{border:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:17px;}
.btnb{background:var(--bld);color:#fff;}
.btnb:hover{background:#2563eb;}
.btng{background:var(--s3);color:var(--mu);}
.btng:hover{background:var(--b1);}
.btnsm{padding:4px 10px;font-size:16px;}
.aform{background:var(--s2);border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid var(--b3);}
.emsg{color:var(--dm);font-size:16px;text-align:center;padding:8px 0;}

/* EXPORT BTN */
.exp-btn{background:#064e3b;border:1px solid #065f46;color:#6ee7b7;border-radius:8px;padding:6px 12px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;}
.exp-btn:hover{background:#065f46;}

::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--b3);border-radius:3px;}

/* DAY TASK SECTION */
.dtask{border-top:1px solid var(--b1);margin-top:6px;padding-top:6px;}
.dtask-ttl{font-size:10px;color:var(--di);letter-spacing:1px;font-weight:700;text-transform:uppercase;margin-bottom:3px;}
.dtask-item{margin-bottom:5px;background:var(--s2);border-radius:8px;padding:5px 7px;border:1px solid var(--b1);transition:border-color .2s,background .2s;}
.dtask-item.task-highlight{border-color:#f59e0b !important;border-width:2px !important;background:#1a0f00;animation:taskPulse .7s ease 4;}
@keyframes taskPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.6)}50%{box-shadow:0 0 0 10px rgba(245,158,11,0)}}
tr.row-hl td{background:#1a0f00 !important;transition:background .1s;}
tr.row-hl{outline:2px solid #f59e0b;outline-offset:-1px;animation:rowPulse .7s ease 4;}
@keyframes rowPulse{0%,100%{outline-color:rgba(245,158,11,0)}25%,75%{outline-color:rgba(245,158,11,.9)}}
body.light tr.row-hl td{background:#fef3c7 !important;}
body.light tr.row-hl{outline-color:#d97706;}
.wo-card-row td{border-top:0.5px solid var(--b2) !important;padding-top:8px !important;}
.wo-card-row td:first-child{border-left:0.5px solid var(--b2);border-top-left-radius:8px;}
.wo-card-row td:last-child{border-right:0.5px solid var(--b2);border-top-right-radius:8px;}
.task-chip{font-size:17px;padding:2px 8px;border-radius:4px;background:var(--s3);color:var(--di);border:0.5px solid var(--b2);cursor:pointer;white-space:nowrap;}
.task-chip:hover{background:#2d1a00;color:#f59e0b;border-color:#854F0B;}
.chip-pending{background:#4c0f0f;color:#fecaca;border:0.5px solid #991b1b;animation:chipBlink 1.4s ease-in-out infinite;font-size:17px;padding:2px 8px;border-radius:4px;cursor:pointer;white-space:nowrap;}
.chip-pending:hover{background:#7f1d1d;color:#fff1f1;}
body.light .chip-pending{background:#FCEBEB;color:#A32D2D;border:0.5px solid #F09595;}
body.light .chip-pending:hover{background:#F09595;color:#501313;}
@keyframes chipBlink{0%,100%{opacity:1}50%{opacity:.3}}
.task-chip:hover{background:#2d1a00;color:#f59e0b;border-color:#854F0B;}
.dtask-name{font-size:12px;color:var(--mu);font-weight:700;margin-bottom:4px;}
.dtask-prow{display:flex;align-items:center;gap:4px;padding:1px 3px;border-radius:4px;min-width:0;}
.dtask-prow:hover{background:var(--s3);}
.dtask-pname{font-size:11px;color:var(--cy);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dtask-pname.done{color:var(--gn);text-decoration:line-through;}

/* PER-DAY PERSON MANAGEMENT */
.add-ppl-btn{background:var(--s3);border:1px dashed var(--b3);border-radius:12px;color:var(--di);font-size:17px;padding:2px 8px;cursor:pointer;}
.add-ppl-btn:hover{border-color:var(--bl);color:var(--cy);}
.add-ppl-dropdown{background:var(--s2);border:1px solid var(--b3);border-radius:8px;padding:4px;margin-top:4px;}
.add-ppl-opt{display:block;width:100%;background:none;border:none;color:var(--mu);text-align:left;padding:3px 8px;font-size:16px;border-radius:4px;cursor:pointer;}
.add-ppl-opt:hover{background:var(--s3);color:var(--cy);}

/* PANEL PERSONAL LISTAS */
.ppl-lists{padding-top:12px;background:var(--s1);border-radius:12px;border:1px solid var(--b1);padding:14px;margin-bottom:10px;}
.ppl-list-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.ppl-list-grid{grid-template-columns:1fr;}}
.ppl-list-col{background:var(--s2);border-radius:10px;border:1px solid var(--b1);padding:10px;}
.ppl-list-ttl{font-size:17px;color:var(--di);letter-spacing:2px;font-weight:700;text-transform:uppercase;margin-bottom:8px;}
.ppl-list-add input{flex:1;background:var(--s3);border:1px solid var(--b2);border-radius:7px;color:var(--mu);padding:4px 9px;font-size:16px;outline:none;font-family:'Barlow',sans-serif;}
.ppl-list-add input:focus{border-color:var(--bl);}
/* Confirm delete */
.btn-del2{background:#7f1d1d;border:none;border-radius:5px;color:#fca5a5;font-size:17px;font-weight:700;padding:2px 8px;cursor:pointer;animation:pulse .4s ease;}
.btn-del2:hover{background:#991b1b;}
.btn-cancel{background:none;border:none;color:var(--di);font-size:17px;padding:0 3px;cursor:pointer;}
@keyframes pulse{0%{transform:scale(.9)}100%{transform:scale(1)}}
.ppl-mgmt{background:var(--s1);border-radius:12px;border:1px solid var(--b1);margin-bottom:14px;overflow:hidden;}
.ppl-mgmt-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;}
.ppl-mgmt-hdr:hover{background:var(--s2);}
.ppl-mgmt-body{padding:12px 14px;border-top:1px solid var(--b1);}
.ppl-table{width:100%;border-collapse:collapse;}
.ppl-table th{font-size:16px;color:var(--di);letter-spacing:2px;font-weight:700;text-transform:uppercase;padding:4px 8px;text-align:left;border-bottom:1px solid var(--b1);}
.ppl-table td{padding:5px 8px;font-size:17px;border-bottom:1px solid var(--b1);vertical-align:middle;}
.ppl-table tr:last-child td{border-bottom:none;}
.status-sel{background:var(--s3);border:1px solid var(--b2);border-radius:6px;color:var(--mu);padding:2px 6px;font-size:16px;font-weight:700;outline:none;cursor:pointer;}
.status-sel:focus{border-color:var(--bl);}
.status-presente{color:#22c55e;}
.status-ausente{color:#ef4444;}
.status-permiso{color:#f59e0b;}
.status-licencia{color:#a855f7;}
.reemplazo-inp{background:var(--s3);border:1px solid var(--b2);border-radius:6px;color:var(--cy);padding:2px 8px;font-size:16px;outline:none;width:130px;}
.reemplazo-inp:focus{border-color:var(--bl);}
.obs-inp{background:var(--s3);border:1px solid var(--b2);border-radius:6px;color:var(--mu);padding:2px 8px;font-size:16px;outline:none;width:100%;}
.wo-inp{background:transparent;border:1px solid transparent;border-radius:5px;color:var(--tx);padding:4px 7px;font-size:15.5px;outline:none;font-family:inherit;}
.wo-inp:hover{border-color:var(--b2);background:var(--s3);}
.wo-inp:focus{border-color:var(--bl);background:var(--s3);}
/* Checkbox de actividad OS: rojo=pendiente, verde=hecha */
.os-check{width:20px;height:20px;cursor:pointer;appearance:none;-webkit-appearance:none;border:2px solid #ef4444;border-radius:5px;background:transparent;position:relative;transition:all .15s;flex-shrink:0;}
.os-check:hover{box-shadow:0 0 0 3px #ef444433;}
.os-check:checked{border-color:#22c55e;background:#22c55e22;}
.os-check:checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);color:#22c55e;font-size:16px;font-weight:900;}
.os-check:disabled{cursor:default;opacity:.7;}
.obs-inp:focus{border-color:var(--bl);}
.day-nav{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}

<script>
// ── Contraseñas de acceso (hash SHA-256, nunca en texto plano) ───────────────
const ADMIN_HASH = 'b53a63a37c49c10ef874861305b0fa7afca3d0941277c8662b0a7d11c522d8ef';
const SUPER_HASH = 'd03f0779393f4a0893d28ab612ffb4f9334f5bded79716925a701328a5b1ccc2';
const SUPER43_HASH = 'fa544640d7cef75e5ad306dd941e3909c9bdc81ffff95915323d11ed0660d33d';
const TEC_HASH = 'daa6aeab5dc51a5feb63fa625c1a2e8dcc2f44b2e1ab72f8d6ecb5821c353657';
const TEC43_HASH = '5fd6b4699a4b4f9ccacdacdad80c36e1979cbc742018b853cac01b0788186002';
const PASS_KEY    = 'workcal_auth';
const SUP_KEY     = 'workcal_supervisor';
const T43_KEY     = 'workcal_t43';
const TEC_KEY     = 'workcal_tecnico';
const ADMIN_KEY   = 'workcal_admin';
const REMEMBER_KEY = 'workcal_remember'; // {hash, expires, flags}

function saveRemember(hash, flags) {
  const expires = Date.now() + 7 * 24 * 60 * 60 * 1000;
  localStorage.setItem(REMEMBER_KEY, JSON.stringify({hash, expires, flags}));
}
function loadRemember() {
  try {
    const r = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null');
    if (!r || Date.now() > r.expires) { localStorage.removeItem(REMEMBER_KEY); return null; }
    return r;
  } catch(e) { return null; }
}
function applyFlags(flags) {
  sessionStorage.setItem(PASS_KEY, '1');
  flags.sup  ? sessionStorage.setItem(SUP_KEY,'1')   : sessionStorage.removeItem(SUP_KEY);
  flags.t43  ? sessionStorage.setItem(T43_KEY,'1')   : sessionStorage.removeItem(T43_KEY);
  flags.tec  ? sessionStorage.setItem(TEC_KEY,'1')   : sessionStorage.removeItem(TEC_KEY);
  flags.adm  ? sessionStorage.setItem(ADMIN_KEY,'1') : sessionStorage.removeItem(ADMIN_KEY);
}

async function sha256hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,'0')).join('');
}

async function checkPass() {
  const val = document.getElementById('lock-input').value;
  const hash = await sha256hex(val);
  const remember = document.getElementById('remember-pass') && document.getElementById('remember-pass').checked;
  let flags = null;
  if (hash === SUPER_HASH) {
    flags = {sup:false, t43:false, tec:false, adm:false};
  } else if (hash === SUPER43_HASH) {
    flags = {sup:false, t43:true, tec:false, adm:false};
  } else if (hash === TEC_HASH) {
    flags = {sup:true, t43:false, tec:true, adm:false};
  } else if (hash === TEC43_HASH) {
    flags = {sup:true, t43:true, tec:true, adm:false};
  } else if (hash === ADMIN_HASH) {
    flags = {sup:true, t43:false, tec:false, adm:true};
  }
  if (flags !== null) {
    applyFlags(flags);
    if (remember) saveRemember(hash, flags);
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (typeof window.initApp === 'function') {
      window.initApp();
    } else {
      // El módulo aún no cargó, esperar
      const _t = setInterval(() => {
        if (typeof window.initApp === 'function') { clearInterval(_t); window.initApp(); }
      }, 50);
    }
  } else {
    const err = document.getElementById('lock-err');
    err.style.display = 'block';
    document.getElementById('lock-input').value = '';
    document.getElementById('lock-input').focus();
  }
}

// ¿La sesión está en la vista exclusiva del turno 4-3?
function isT43View() { return sessionStorage.getItem(T43_KEY) === '1'; }

// ¿La sesión está en la vista técnico (solo lectura limitada)?
function isTecView() { return sessionStorage.getItem(TEC_KEY) === '1'; }

// ¿La sesión está en la vista admin (solo lectura, ve todo, descarga Excel)?
function isAdminView() { return sessionStorage.getItem(ADMIN_KEY) === '1'; }

// Solo lectura: supervisor y técnico no pueden escribir
function isSupervisor() { return sessionStorage.getItem(SUP_KEY) === '1' || sessionStorage.getItem(TEC_KEY) === '1'; }

// Auto-login si ya autenticó en esta sesión
if (sessionStorage.getItem(PASS_KEY) === '1') {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
} else {
  // Limpiar el campo por si el browser autocompletó algo
  setTimeout(() => {
    const inp = document.getElementById('lock-input');
    if (inp) inp.value = '';
  }, 100);
}
</script>

<script type="module">
// ── Inicio condicional ────────────────────────────────────────────────────────
const _alreadyAuth = sessionStorage.getItem('workcal_auth') === '1';

// ── Sanitización HTML (previene XSS) ─────────────────────────────────────────
// Usar siempre esc() para insertar datos de usuario en innerHTML
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;')
    .replace(/\//g, '&#x2F;');
}

// ── Firebase config ───────────────────────────────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVamraopnszJcDJFHwjh2TcLDF3jVp4Ks",
  authDomain: "workcalendario-7ba05.firebaseapp.com",
  projectId: "workcalendario-7ba05",
  storageBucket: "workcalendario-7ba05.firebasestorage.app",
  messagingSenderId: "539192589342",
  appId: "1:539192589342:web:62158df090ac90af38820f"
};

const fbApp = initializeApp(firebaseConfig);
const db    = getFirestore(fbApp);

// ── Persistencia offline (IndexedDB) ─────────────────────────────────────────
// Si la conexión cae, los datos cacheados siguen disponibles y los cambios
// se sincronizan automáticamente cuando vuelve la conexión.
enableIndexedDbPersistence(db).catch(err => {
  if (err.code === 'failed-precondition') {
    console.warn('Firestore offline: múltiples pestañas abiertas, persistencia deshabilitada.');
  } else if (err.code === 'unimplemented') {
    console.warn('Firestore offline: navegador no soporta persistencia local.');
  } else {
    console.warn('Firestore offline deshabilitado:', err.code);
  }
  // La persistencia es opcional — continuar sin ella
});

// ── Storage key ───────────────────────────────────────────────────────────────
// ── Listas de personal — sincronizadas en Firestore ──────────────────────────
const DFLT_PERSONAL   = ['Rafael Taucare','Claudio Guzman','Carlos Pasten','Jose Aguilera','Yerko Villarroel'];
const DFLT_REEMPLAZO  = ['Diego Solis','Gonzalo Alvarez','Victor Jiménez','Javiera Montecinos','Gabriel Badilla','Ariel Quintana','Sebastián Zarate','Ivett Rojas','Ignacio Veas','Ignacio Morales'];

// LISTS se inicializa con los valores por defecto y se sobreescribe
// en cuanto llega el snapshot de Firestore (listsDocRef)
let LISTS = { personal: [...DFLT_PERSONAL], reemplazo: [...DFLT_REEMPLAZO] };

function listsDocRef() {
  return doc(db, 'workcal_config', 'lists');
}

// Guardar listas en Firestore (reemplaza localStorage)
function saveLists(l) {
  if (isSupervisor()) return; // solo lectura
  setDoc(listsDocRef(), { personal: l.personal, reemplazo: l.reemplazo })
    .catch(err => console.error('saveLists error:', err));
}

// Suscribir cambios de listas en tiempo real
let _unsubLists = null;
function subscribeLists() {
  if (_unsubLists) { _unsubLists(); _unsubLists = null; }
  let _listsFirstSnap = true;
  _unsubLists = onSnapshot(listsDocRef(), snap => {
    if (snap.exists()) {
      const data = snap.data();
      const newStr = JSON.stringify(data);
      const oldStr = JSON.stringify(LISTS);
      if (newStr !== oldStr) {
        LISTS = { personal: data.personal || [], reemplazo: data.reemplazo || [] };
        _invalidateAllSnaps();
      }
      // Siempre renderizar en el primer snapshot para quitar el mensaje "Conectando..."
      if (_listsFirstSnap) { _listsFirstSnap = false; render(); }
      else if (newStr !== oldStr) render();
    } else {
      // Primera vez: no existe el documento → guardar defaults y renderizar
      saveLists(LISTS);
      if (_listsFirstSnap) { _listsFirstSnap = false; render(); }
    }
  }, err => { console.error('subscribeLists error:', err); if (_listsFirstSnap) { _listsFirstSnap = false; render(); } });
}

function addToList(type, name) {
  if (isSupervisor()) { showLimitAlert('Modo Supervisor', 'Solo lectura.'); return; }
  name = name.trim(); if (!name) return;
  if (name.length > 80) { console.warn('Nombre demasiado largo ignorado'); return; }
  if (!['personal','reemplazo'].includes(type)) return;
  if (!LISTS[type].includes(name)) {
    LISTS[type] = [...LISTS[type], name];
    saveLists(LISTS); // guarda en Firestore; onSnapshot actualizará el render
    render(); // render inmediato local
  }
}
function removeFromList(type, idx) {
  if (isSupervisor()) { showLimitAlert('Modo Supervisor', 'Solo lectura.'); return; }
  LISTS[type] = LISTS[type].filter((_, i) => i !== idx);
  saveLists(LISTS);
  render();
}

// ── Nombres de días (Martes → Lunes) ─────────────────────────────────────────
const DNAMES = ['Martes','Miércoles','Jueves','Viernes','Sábado','Domingo','Lunes'];
const MONTHS  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// ── Tareas fijas (no se pueden eliminar desde la UI) ─────────────────────────
const DFLT = [
  {id:'flex',       label:'Flex',      sub:[
    {id:'ovcc',label:'OVCC'},
    {id:'ops', label:'OPS'},
    {id:'ctp', label:'CTP'},
  ]},
  {id:'cierre-ots', label:'Cierre OTs', sub:[]},
  {id:'ert2',       label:'Evaluacion ERT2.0', sub:[]},
];

// ── Sistema de semanas: Martes 12 mayo 2026 = semana 0 ───────────────────────
const REF_DATE = new Date(Date.UTC(2026, 4, 12));

function getWeekNum(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  return Math.floor((d - REF_DATE) / (86400000 * 7));
}

const _weekDaysCache = new Map();
// getWeekDays siempre devuelve los 7 días base (Mar→Lun)
// getActiveDays devuelve los días reales según el turno
function getWeekDays(weekNum) {
  if (_weekDaysCache.has(weekNum)) return _weekDaysCache.get(weekNum);
  const days = Array.from({length: 7}, (_, i) => {
    const d = new Date(REF_DATE);
    d.setUTCDate(REF_DATE.getUTCDate() + weekNum * 7 + i);
    return d;
  });
  _weekDaysCache.set(weekNum, days);
  return days;
}
// Para turno 4-3 devuelve [{date, di}] solo Lun-Jue; para otros los 7 días
function getActiveDays(weekNum) {
  const all = getWeekDays(weekNum);
  if (isTurno43(weekNum)) {
    return TURNO43_DIAS.map(di => ({ date: all[di], di }));
  }
  return all.map((date, di) => ({ date, di }));
}

function getWeekLabel(weekNum) {
  const days = getWeekDays(weekNum);
  // Turno 4-3: Lun(6) → Jue(2)
  const s = isTurno43(weekNum) ? days[6] : days[0];
  const e = isTurno43(weekNum) ? days[2] : days[6];
  const ys = s.getUTCFullYear(), ye = e.getUTCFullYear();
  const ms = MONTHS[s.getUTCMonth()], me = MONTHS[e.getUTCMonth()];
  if (s.getUTCMonth() === e.getUTCMonth() && ys === ye)
    return `${s.getUTCDate()}–${e.getUTCDate()} ${ms} ${ys}`;
  if (ys === ye)
    return `${s.getUTCDate()} ${ms} – ${e.getUTCDate()} ${me} ${ys}`;
  return `${s.getUTCDate()} ${ms} ${ys} – ${e.getUTCDate()} ${me} ${ye}`;
}

const _isoWeekCache = new Map();
function getISOWeek(date) {
  const key = date.getTime();
  if (_isoWeekCache.has(key)) return _isoWeekCache.get(key);
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const result = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  _isoWeekCache.set(key, result);
  return result;
}

// Builds a list of all turno-weeks for the current year for the jump selector
const _yearWeeksCache = new Map();
function getYearWeeks(year) {
  if (_yearWeeksCache.has(year)) return _yearWeeksCache.get(year);
  const weeks = [];
  const jan1 = new Date(Date.UTC(year, 0, 1));
  const firstWn = getWeekNum(jan1);
  for (let wn = firstWn; wn <= firstWn + 53; wn++) {
    const days = getWeekDays(wn);
    const midWeek = days[3];
    if (midWeek.getUTCFullYear() === year) weeks.push(wn);
  }
  _yearWeeksCache.set(year, weeks);
  return weeks;
}

// En la vista 4-3 (contraseña workcal43) el turno es siempre 4-3.
// En la vista normal nunca es 4-3 (los datos están separados por vista).
function isTurno43(weekNum) {
  return isT43View();
}
function turn(weekNum) {
  if (isTurno43(weekNum)) return 'Turno 4-3';
  return weekNum % 2 === 0 ? 'Turno 2-4' : 'Turno 1-3';
}
// Días del turno 4-3: Lun(idx 6), Mar(0), Mié(1), Jue(2)
const TURNO43_DIAS = [6, 0, 1, 2];
const DNAMES43 = { 6:'Lunes', 0:'Martes', 1:'Miércoles', 2:'Jueves' };
// Clave de Firestore: la vista 4-3 usa su propio espacio de datos (sufijo _T43)
function wk(weekNum) { return `WRK${weekNum >= 0 ? '+' : ''}${weekNum}${isT43View() ? '_T43' : ''}`; }
function uid() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2); }
function bdg(l, c='#3b82f6') {
  return `<span class="bdg" style="background:${c}22;color:${c};border:1px solid ${c}44">${l}</span>`;
}

// ── Tema (persiste en localStorage) ──────────────────────────────────────────
const SK_THEME = 'workcal_theme';
function loadTheme() {
  const t = localStorage.getItem(SK_THEME) || 'dark';
  document.body.classList.toggle('light', t === 'light');
  return t;
}
function toggleTheme() {
  // Agregar clase de transición solo durante el cambio de tema
  document.body.classList.add('theme-transitioning');
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem(SK_THEME, isLight ? 'light' : 'dark');
  _invalidateAllSnaps();

let _unsub = null; // listener activo

function weekDocRef(weekNum) {
  return doc(db, 'weeks', wk(weekNum));
}

// Escucha cambios en tiempo real para la semana visible
function subscribeWeek(weekNum) {
  if (_unsub) { _unsub(); _unsub = null; }
  const ref = weekDocRef(weekNum);

  // Timeout: si Firestore no responde en 8s, mostrar error y permitir reintentar
  let _timeoutId = setTimeout(() => {
    if (!S.synced) {
      S.synced = true; // desbloquear la pantalla
      document.getElementById('app').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:80vh;
                    flex-direction:column;gap:16px;color:#94a3b8;font-family:Barlow,sans-serif;padding:20px;text-align:center">
          <div style="font-size:36px">📡</div>
          <div style="font-size:16px;font-weight:700;color:#f87171">Sin conexión a Firebase</div>
          <div style="font-size:17px;color:#64748b;max-width:300px">
            No se pudo conectar con el servidor. Verifica tu conexión a internet o las reglas de Firestore.
          </div>
          <button onclick="location.reload()"
            style="margin-top:8px;background:#1d4ed8;border:none;border-radius:10px;
                   color:#fff;padding:10px 24px;font-size:16px;font-weight:700;cursor:pointer">
            <i class="ti ti-refresh" style="color:#3b82f6"></i> Reintentar
          </button>
        </div>`;
    }
  }, 8000);

  _unsub = onSnapshot(ref, snap => {
    clearTimeout(_timeoutId); // conexión exitosa — cancelar timeout
    const remote = snap.exists() ? snap.data() : {};
    const key = wk(weekNum);
    const prevStr = JSON.stringify(S.data[key] || {});
    const nextStr = JSON.stringify(remote);
    S.data[key] = remote;
    S.synced = true;
    if (prevStr !== nextStr) {
      render();
    } else if (!document.getElementById('r-hdr')?.firstElementChild) {
      render();
    }
  }, err => {
    clearTimeout(_timeoutId);
    console.error('Firestore error:', err);
    // Si nunca llegó a sincronizar, mostrar error en pantalla
    if (!S.synced) {
      S.synced = true;
      document.getElementById('app').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:80vh;
                    flex-direction:column;gap:16px;color:#94a3b8;font-family:Barlow,sans-serif;padding:20px;text-align:center">
          <div style="font-size:36px"><i class="ti ti-alert-triangle" style="color:#f59e0b"></i></div>
          <div style="font-size:16px;font-weight:700;color:#f87171">Error de conexión</div>
          <div style="font-size:17px;color:#64748b;max-width:300px">${err.message || err.code || 'Error desconocido'}</div>
          <button onclick="location.reload()"
            style="margin-top:8px;background:#1d4ed8;border:none;border-radius:10px;
                   color:#fff;padding:10px 24px;font-size:16px;font-weight:700;cursor:pointer">
            <i class="ti ti-refresh" style="color:#3b82f6"></i> Reintentar
          </button>
        </div>`;
    } else {
      showSyncStatus('error');
    }
  });
}

// Guarda cambios de la semana actual en Firestore (merge para no pisar otros campos)
async function save(weekData) {
  const k = wk(S.week);
  try {
    await setDoc(weekDocRef(S.week), weekData[k] || {}, { merge: true });
    showSyncStatus('ok');
  } catch(e) {
    console.error('Save error:', e);
    showSyncStatus('error');
  }
}

// Indicador visual de sincronización
function showSyncStatus(status) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  clearTimeout(el._t);
  if (status === 'ok') {
    el.innerHTML = '<i class="ti ti-circle-check" style="color:#22c55e"></i> Guardado';
    el.style.color = '#22c55e';
  } else if (status === 'syncing') {
    el.innerHTML = '<i class="ti ti-refresh"></i> Sincronizando...';
    el.style.color = '#f59e0b';
    return; // no restaurar automático mientras sincroniza
  } else {
    el.innerHTML = '<i class="ti ti-alert-circle" style="color:#ef4444"></i> Error sync';
    el.style.color = '#ef4444';
  }
  el._t = setTimeout(() => { if(el){ el.innerHTML = '<i class="ti ti-refresh"></i> Sincronizar'; el.style.color=''; } }, 2500);
}

// Fuerza re-suscripción a Firestore y refresca render
function forceSync() {
  const el = document.getElementById('sync-status');
  if (el) { el.innerHTML = '<i class="ti ti-refresh"></i> Sincronizando...'; el.style.color = '#f59e0b'; }

}

function wd() { return S.data[wk(S.week)] || {}; }
// Claves permitidas en el documento de semana (whitelist)
const ALLOWED_WEEK_KEYS = new Set([
  'people','tasks','customTasks','days','dayTasks','dayPeople',
  'attendance','pplStatus','pplPeriods','dayNotes','osActivities','workOrders','osPanel'
]);

function swd(ch) {
  // Vista técnico: solo puede tickear (escribir workOrders / osPanel), nada más
  if (isTecView()) {
    const keys = Object.keys(ch);
    const soloTickeo = keys.length > 0 && keys.every(k => k === 'workOrders' || k === 'osPanel');
    if (!soloTickeo) {
      showLimitAlert('Vista Técnico', 'Solo puedes marcar órdenes como realizadas.');
      return;
    }
    // permitido: continúa al guardado
  } else if (isSupervisor()) {
    // Admin / solo lectura: no permite ninguna escritura
    showLimitAlert('Solo lectura', 'No tienes permisos para modificar datos.');
    return;
  }
  // Validar que solo se escriban claves conocidas
  const invalid = Object.keys(ch).filter(k => !ALLOWED_WEEK_KEYS.has(k));
  if (invalid.length) {
    console.error('swd: claves no permitidas ignoradas:', invalid);
    invalid.forEach(k => delete ch[k]);
  }
  const k = wk(S.week);
  S.data[k] = { ...S.data[k], ...ch };
  save(S.data);
  render();
}

function addPerson(name) {
  name = name.trim(); if (!name) return;
  if (name.length > 80) { console.warn('Nombre demasiado largo ignorado'); return; }
  const w = wd(); const ppl = [...(w.people || [])];
  if (ppl.includes(name)) return;
  ppl.push(name);

  // Auto-asignar persona a todas las tareas existentes
  let tasks = JSON.parse(JSON.stringify(w.tasks || []));
  function assignToTask(dt) {
    if ((dt.sub || []).length) {
      let ex = tasks.find(t => t.id === dt.id);
      const bs = (dt.sub || []).map(s => ({id: s.id, label: s.label, personData: {}, people: []}));
      const subs = (ex?.subChecks || bs).map(s => ({...s, people: [...(s.people || []), name]}));
      if (ex) tasks = tasks.map(t => t.id === dt.id ? {...t, subChecks: subs} : t);
      else tasks.push({id: dt.id, subChecks: subs});
    } else {
      let ex = tasks.find(t => t.id === dt.id);
      if (ex) tasks = tasks.map(t => t.id === dt.id ? {...t, people: [...(t.people || []), name]} : t);
      else tasks.push({id: dt.id, personData: {}, people: [name]});
    }
  }
  DFLT.forEach(assignToTask);
  let ct = (w.customTasks || []).map(c => {
    const newC = {...c, people: [...(c.people || []), name]};
    if ((c.sub || []).length) {
      newC.sub = (c.sub || []).map(s => ({...s, people: [...(s.people || []), name]}));
    }
    return newC;
  });
  // Limpiar estado previo de la persona — debe arrancar como Presente
  const ps = JSON.parse(JSON.stringify(w.pplStatus || {}));
  Object.keys(ps).forEach(d => { if (ps[d][name]) delete ps[d][name]; });
  const pp = JSON.parse(JSON.stringify(w.pplPeriods || {}));
  delete pp[name];

  swd({people: ppl, tasks, customTasks: ct, pplStatus: ps, pplPeriods: pp});
}

function removePerson(idx) {
  const w = wd(); const p = [...(w.people || [])];
  const name = p[idx]; p.splice(idx, 1);
  let tasks = JSON.parse(JSON.stringify(w.tasks || []));
  tasks = tasks.map(t => {
    const nt = {...t, people: (t.people || []).filter(x => x !== name)};
    if (t.subChecks) nt.subChecks = t.subChecks.map(s => ({...s, people: (s.people || []).filter(x => x !== name)}));
    return nt;
  });
  let ct = (w.customTasks || []).map(c => {
    const nc = {...c, people: (c.people || []).filter(x => x !== name)};
    if ((c.sub || []).length) nc.sub = (c.sub || []).map(s => ({...s, people: (s.people || []).filter(x => x !== name)}));
    return nc;
  });
  swd({people: p, tasks, customTasks: ct});
}

  if (!dt[di]) dt[di] = {};
  if (!dt[di]['yd0']) dt[di]['yd0'] = {};

    const allEffective = resolveEffectivePeople(di, LISTS.personal).map(e => e.name);
    // Incluir también al personal base por si hay datos guardados de ellos
    const allToReset = new Set([...LISTS.personal, ...allEffective]);

    });

    const k = wk(S.week);

    const excKey = `__exc__${taskId}`;

    // Quitar de exclusiones
    dp[key][excKey] = (dp[key][excKey] || []).filter(p => p !== person);

// ── Períodos de estado por persona (múltiples períodos por semana) ────────────
// pplPeriods: { [person]: [{estado, reemplazo, obs, desde, hasta}] }

function getPersonPeriods(person) {

function getPplStatus(di, person) {
  const periods = getPersonPeriods(person);
  // Buscar el período que cubre este día (último que coincida en caso de overlap)
  const match = periods.slice().reverse().find(p => di >= p.desde && di <= p.hasta);
  if (match) return { estado: match.estado, reemplazo: match.reemplazo || '', obs: match.obs || '' };
  return { estado: 'Presente', reemplazo: '', obs: '' };
}

function addPersonPeriod(person, estado, reemplazo, obs, desde, hasta) {
  const w = wd();
  const pp = JSON.parse(JSON.stringify(w.pplPeriods || {}));
  if (!pp[person]) pp[person] = [];
  // Eliminar períodos que se solapan con el nuevo rango
  pp[person] = pp[person].filter(p => p.hasta < parseInt(desde) || p.desde > parseInt(hasta));
  // Si el estado es Presente sin reemplazo, no agregar (es el default)
  if (estado !== 'Presente' || reemplazo) {
    pp[person].push({ estado, reemplazo: reemplazo || '', obs: obs || '', desde: parseInt(desde), hasta: parseInt(hasta) });
  }
  // Limpiar pplStatus legacy para este rango
  const ps = JSON.parse(JSON.stringify(w.pplStatus || {}));
  for (let d = parseInt(desde); d <= parseInt(hasta); d++) {
    if (ps[d] && ps[d][person]) delete ps[d][person];
  }
  swd({ pplPeriods: pp, pplStatus: ps });
}

function removePersonPeriod(person, idx) {
  const w = wd();
  const pp = JSON.parse(JSON.stringify(w.pplPeriods || {}));
  if (!pp[person]) return;
  pp[person].splice(idx, 1);
  swd({ pplPeriods: pp });
}
window.removePersonPeriod = removePersonPeriod;
window.addPersonPeriod = addPersonPeriod;

function setPersonDayStatus(di, person, estado) {
  // Cambia el estado del día — crea/actualiza período de un solo día
  const w = wd();
  const pp = JSON.parse(JSON.stringify(w.pplPeriods || {}));
  if (!pp[person]) pp[person] = [];
  // Busca si ya existe un período que cubra exactamente este día
  const idx = pp[person].findIndex(p => p.desde === di && p.hasta === di);
  if (estado === 'Presente') {
    // Si vuelve a Presente, elimina el período de ese día si existe
    if (idx >= 0) pp[person].splice(idx, 1);
    // También elimina del pplStatus legacy
    const ps = JSON.parse(JSON.stringify(w.pplStatus || {}));
    if (ps[di] && ps[di][person]) { delete ps[di][person]; swd({ pplPeriods: pp, pplStatus: ps }); }
    else swd({ pplPeriods: pp });
  } else {
    if (idx >= 0) { pp[person][idx].estado = estado; }
    else { pp[person].push({ desde: di, hasta: di, estado, reemplazo: '', obs: '' }); }
    swd({ pplPeriods: pp });
  }
}
function setPplStatus(di, person, field, val) {
  // Usado solo para obs inline — actualiza el período que cubre este día
  const w = wd();
  const pp = JSON.parse(JSON.stringify(w.pplPeriods || {}));
  if (!pp[person]) pp[person] = [];
  const idx = pp[person].findIndex(p => di >= p.desde && di <= p.hasta);
  if (idx >= 0) { pp[person][idx][field] = val; swd({ pplPeriods: pp }); }
}

// ── renderDayTasks ────────────────────────────────────────────────────────────
// ── Resuelve la lista efectiva de personas para un día dado ──────────────────
// Si alguien está ausente/permiso/licencia:
//   - Si tiene reemplazo → el reemplazante aparece en su lugar (etiquetado)
//   - Si no tiene reemplazo → simplemente no aparece
// Caché de resolveEffectivePeople — se invalida al inicio de cada render
let _effectiveCache = new Map();
function _invalidateEffectiveCache() { _effectiveCache = new Map(); }

function resolveEffectivePeople(di, basePpl) {
  const key = `${di}:${basePpl.join(',')}`;
  if (_effectiveCache.has(key)) return _effectiveCache.get(key);
  const result = [];
  basePpl.forEach(p => {
    const st = getPplStatus(di, p);
    if (st.estado === 'Presente') {
      result.push({name: p, isReplacement: false, replacedFor: null});
    } else {
      const rep = (st.reemplazo || '').trim();
      if (rep && !result.find(r => r.name === rep)) {
        result.push({name: rep, isReplacement: true, replacedFor: p, estado: st.estado});
      }
    }
  });
  _effectiveCache.set(key, result);
  return result;
}

function renderDayTasks(di) {
  const w = wd(); const allPpl = w.people || [];
  // Solo personal a cargo aparece en tareas; los reemplazantes entran via resolveEffectivePeople
  const personalACargo = allPpl.filter(p => LISTS.personal.includes(p));
  if (!personalACargo.length) return '';
  let h = `<div class="dtask"><div class="dtask-ttl"><i class="ti ti-circle-check" style="color:#22c55e"></i> Tareas del día</div>`;
  let hasContent = false;

  function renderTaskBlock(taskId, label, defaultPpl) {
    // Filtrar la lista base a solo personal a cargo
    const filteredDefault = defaultPpl.filter(p => LISTS.personal.includes(p));
    const assignedPpl = getDayTaskPeople(di, taskId, filteredDefault).filter(p => LISTS.personal.includes(p));
    if (!assignedPpl.length && !personalACargo.length) return '';

    // Resolver efectivos: ausentes → reemplazantes (o eliminados), filtrando exclusiones por tarea
    const effective = resolveEffectivePeople(di, assignedPpl)
      .filter(e => !e.isReplacement || !isRepExcludedFromTask(di, taskId, e.name));
    // Agregar reemplazantes incluidos explícitamente (vía + Persona)
    const dp = (wd().dayPeople || {});
    const incKey = `__inc__${taskId}`;
    const explicitReps = ((dp[String(di)] || {})[incKey] || [])
      .filter(p => !effective.find(e => e.name === p));
    explicitReps.forEach(p => effective.push({name: p, isReplacement: false, replacedFor: null}));

    // Para el dropdown "+" mostrar cualquier persona activa esta semana con estado Presente ese día
    const notAssigned = allPpl
      .filter(p => !assignedPpl.includes(p))
      .filter(p => !effective.find(e => e.name === p))
      .filter(p => getPplStatus(di, p).estado === 'Presente');

    if (!effective.length && !notAssigned.length) return '';  // nada que mostrar ni agregar

    // YD: uno al día — si alguien ya lo hizo, mostrar solo a ese; ocultar al resto
    if (taskId === 'yd0') {
      const donePerson = effective.find(e => getDT(di, 'yd0', e.name).done);
      if (donePerson) {
        effective.splice(0, effective.length, donePerson);
      }
    }
    // Flex: mostrar solo personas con qty > 0 este día
    if (taskId.startsWith('flex__')) {
      const withQty = effective.filter(e => (getDT(di, taskId, e.name).qty || 0) > 0);
      if (withQty.length) effective.splice(0, effective.length, ...withQty);
    }

    hasContent = true;
    const showKey = `${di}_${taskId}`;

    const dtaskId = `dtask-${di}-${taskId.replace(/[^a-z0-9]/gi,'-')}`;
    let h2 = `<div class="dtask-item" id="${dtaskId}" data-tid="${taskId}"><div class="dtask-name">${esc(label)}</div>`;

    // Para OS: no mostrar filas de personas (solo el bloque de actividades)
    if (taskId !== 'os') {
      effective.forEach(e => {
        const p = e.name;
        const d = getDT(di, taskId, p);
        const pe = esc(p); // HTML-safe para atributos
        const repBadge = e.isReplacement ? "" : '';
        const isYD = taskId === 'yd0';
        const ydOnChange = isYD
          ? `setYDDone(${di},'${pe}',this.checked)`
          : `setDT(${di},'${taskId}','${pe}',this.checked);`;
        h2 += `<div class="dtask-prow">
          <input type="checkbox" style="accent-color:var(--gn);width:15px;height:15px;flex-shrink:0;cursor:pointer;" ${d.done ? 'checked' : ''}
            onchange="${ydOnChange}"/>
          <span class="dtask-pname ${d.done ? 'done' : ''}" style="${e.isReplacement ? 'color:#f59e0b' : ''}">${esc(p)}</span>
          ${repBadge}
          ${isYD ? '' : `<div class="qty-stepper">
            <button onmousedown="event.preventDefault()" onclick="(function(btn){var inp=btn.nextElementSibling;var v=Math.max(0,(parseInt(inp.value)||0)-1);inp.value=v;setDTQty(${di},'${taskId}','${pe}',v);})(this)">−</button>
            <input type="number" min="0" value="${d.qty || 0}"
              onchange="setDTQty(${di},'${taskId}','${pe}',this.value)"
              title="Cantidad realizada"/>
            <button onmousedown="event.preventDefault()" onclick="(function(btn){var inp=btn.previousElementSibling;var v=(parseInt(inp.value)||0)+1;inp.value=v;setDTQty(${di},'${taskId}','${pe}',v);})(this)">+</button>
          </div>`}
          ${S.confirmDayDel && S.confirmDayDel.key===`del_${di}_${taskId}_${pe}`
            ? `<span style="font-size:17px;color:var(--am);font-weight:700">¿Quitar?</span>
               <button class="btn-del2" style="font-size:16px;padding:1px 6px" onclick="
                 ${e.isReplacement
                   ? `excludeRepFromTask(${di},'${taskId}','${pe}');`
                   : `removePersonFromDayTask(${di},'${taskId}','${pe}');`
                 }clearConfirmDayDel();">Sí</button>
               <button class="btn-cancel" onclick="clearConfirmDayDel()">No</button>`
            : `<button style="background:none;border:none;color:#ef4444;font-size:16px;padding:0 4px;cursor:pointer;"
                onclick="setConfirmDayDel({key:'del_${di}_${taskId}_${pe}'})"><i class="ti ti-trash"></i></button>`
          }
        </div>`;
      });
      if (notAssigned.length) {
        if (S.showAddPpl[showKey]) {
          h2 += `<div class="add-ppl-dropdown">`;
          notAssigned.forEach(p => {
            const pe = esc(p); // HTML-safe para atributos
            h2 += `<button class="add-ppl-opt" onclick="addPersonToDayTask(${di},'${taskId}','${pe}')">${esc(p)}</button>`;
          });
          h2 += `<button class="add-ppl-opt" style="color:var(--di)" onclick="closeShowAddPpl('${showKey}')"><i class="ti ti-x"></i> Cerrar</button></div>`;
        } else {
          h2 += `<button class="add-ppl-btn" onclick="openShowAddPpl('${showKey}')">+ Persona</button>`;
        }
      }
    }

    h2 += `</div>`;  // cierra dtask-item
    return h2;
  }

  // Tareas fijas
  DFLT.forEach(dt => {
    if (dt.sub.length) {
      getSubs(dt.id, dt).forEach(s => {
        const taskId = `${dt.id}__${s.id}`;
        // Sub-tareas Flex: solo mostrar si qty > 0 este día
        if (dt.id === 'flex') {
          const filteredDef = (s.people || allPpl).filter(p => LISTS.personal.includes(p));
          const assigned = getDayTaskPeople(di, taskId, filteredDef).filter(p => LISTS.personal.includes(p));
          const effective = resolveEffectivePeople(di, assigned).filter(e => !e.isReplacement || !isRepExcludedFromTask(di, taskId, e.name));
          const hasQty = effective.some(e => (getDT(di, taskId, e.name).qty || 0) > 0);
          if (!hasQty) return;
        }
        h += renderTaskBlock(taskId, `${dt.label} › ${s.label}`, s.people || allPpl);
      });
    } else {
      h += renderTaskBlock(dt.id, dt.label, getTaskPeople(getT(dt.id)));
    }
  });

  // Custom tasks — respetar días asignados (ct.dias = null → todos los días)
  (w.customTasks || []).forEach(ct => {
    if (ct.dias && ct.dias.length > 0 && !ct.dias.includes(di)) return; // no aplica este día
    if ((ct.sub || []).length) {
      (ct.sub || []).forEach(s => {
        h += renderTaskBlock(`${ct.id}__${s.id}`, `${ct.label} › ${s.label}`, s.people || allPpl);
      });
    } else {
      h += renderTaskBlock(ct.id, ct.label, getTaskPeople(ct));
    }
  });

  if (!hasContent) h += `<div class="emsg">Sin personal asignado</div>`;

  const _ydBlock = renderTaskBlock('yd0', '🛑 Yo Detengo', personalACargo);
  if (_ydBlock) {
    const _ydEvento = ((wd().days || {})[di] || {}).yoDetengoEvento || '';
    const _eventoHtml = `<div style="display:flex;flex-direction:column;gap:3px;padding:6px 10px 8px;">
      <span style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8">N° EVENTO</span>
      <input class="inp" placeholder="Ej: 20241112-001" value="${_ydEvento.replace(/"/g,'&quot;')}"
        onchange="setYoDetengoEvento(${di},this.value)"
        style="width:100%;padding:5px 10px;font-size:14px;font-weight:700;height:auto;border-radius:6px;"/>
    </div>`;
    // Insertar justo antes del último </div> (cierre del dtask-item)
    h += _ydBlock.slice(0, _ydBlock.lastIndexOf('</div>')) + _eventoHtml + '</div>';
  } else { h += _ydBlock; }

  // Asistencia: solo personal a cargo (presentes y sus reemplazantes)
  if (personalACargo.length) {
    const effectiveAll = resolveEffectivePeople(di, personalACargo);
    h += `<div class="dtask-item" style="margin-top:4px">
      <div class="dtask-name"><i class="ti ti-map-pin"></i> Asistencia / Área</div>`;
    effectiveAll.forEach(e => {
      const p = e.name;
      const area = getAttendance(di, p);
      const pe = p.replace(/'/g, "\\'");
      const repBadge = e.isReplacement

          style="margin:0;flex:1;padding:2px 7px;font-size:16px;height:24px;"/>
      </div>`;
    });
    h += `</div>`;
  }

  h += `</div>`;
  return h;
}

          const flexSubs=[{id:'ovcc',label:'OVCC'},{id:'ops',label:'OPS'},{id:'ctp',label:'CTP'}];
          const activeDaysF=getActiveDays(S.week);
          const _basePpl=(wd().people||[]).filter(p=>LISTS.personal.includes(p));
          // Función para obtener efectivos de un día dado
          function getEffForDay(di){return resolveEffectivePeople(di,_basePpl).map(e=>e.name);}
          if(!_basePpl.length) return '<div class="emsg">Sin personal a cargo esta semana</div>';
          const nowF=new Date();
          const todayUTCF=new Date(Date.UTC(nowF.getFullYear(),nowF.getMonth(),nowF.getDate()));
          let fh='';
          flexSubs.forEach(s=>{
            const tid='flex__'+s.id;
            fh+='<div style="border-bottom:0.5px solid var(--b1);padding:10px 0">';
            fh+='<div style="font-size:16px;font-weight:700;color:var(--cy);margin-bottom:8px">'+s.label+'</div>';
            // Recopilar todas las personas únicas que aparecen en algún día de la semana
            const allPplSet=new Set();
            activeDaysF.forEach(({di:di2})=>getEffForDay(di2).forEach(pp=>allPplSet.add(pp)));
            allPplSet.forEach(p=>{
              const pe=p.replace(/'/g,"\'");
              fh+='<div style="margin-bottom:10px">';
              fh+='<div style="font-size:17px;color:var(--mu);margin-bottom:6px;font-weight:600">'+esc(p)+'</div>';
              fh+='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">';
              activeDaysF.forEach(({date:d,di:i})=>{
                // Solo mostrar este día si esta persona es efectiva ese día
                if(!getEffForDay(i).includes(p)) return;
                const dta=getDT(i,tid,p);
                const qty=dta.qty||0;
                const active=qty>0;
                const isToday=d.getTime()===todayUTCF.getTime();
                const dayLabel=(DNAMES[i]||'?')+' '+d.getUTCDate();
                let bg,brd,labelColor,extra='';
                if(isToday&&active){bg='var(--blb)';brd='#60a5fa';labelColor='#93c5fd';extra='box-shadow:0 0 0 2px #3b82f6;';}
                else if(isToday){bg='#0c1e36';brd='#3b82f6';labelColor='#60a5fa';extra='box-shadow:0 0 0 2px #3b82f6;';}
                else if(active){bg='var(--blb)';brd='var(--bl)';labelColor='var(--cy)';}
                else{bg='var(--s2)';brd='var(--b1)';labelColor='var(--di)';}
                fh+='<div style="display:inline-flex;align-items:center;gap:4px;background:'+bg+';border:0.5px solid '+brd+';border-radius:7px;padding:5px 8px;'+extra+'">';
                fh+='<span style="font-size:16px;color:'+labelColor+';white-space:nowrap;font-weight:'+(isToday?'700':'400')+'">'+(dayLabel+(isToday?' ●':''))+'</span>';
                // Usar data-attrs para evitar problemas de escaping con nombres que contienen comillas
                const diVal=i, tidVal=tid, pVal=p;
                fh+='<div class="qty-stepper flex-qs" style="margin-left:5px" data-di="'+diVal+'" data-tid="'+encodeURIComponent(tidVal)+'" data-p="'+encodeURIComponent(pVal)+'">';
                fh+='<button onmousedown="event.preventDefault()" onclick="(function(el){var s=el.closest(\'.flex-qs\');var di=+s.dataset.di;var tid=decodeURIComponent(s.dataset.tid);var p=decodeURIComponent(s.dataset.p);var inp=el.nextElementSibling;var v=Math.max(0,(parseInt(inp.value)||0)-1);inp.value=v;setDTQty(di,tid,p,v);render();})(this)">−</button>';
                fh+='<input type="number" min="0" value="'+qty+'" onchange="(function(inp){var s=inp.closest(\'.flex-qs\');var di=+s.dataset.di;var tid=decodeURIComponent(s.dataset.tid);var p=decodeURIComponent(s.dataset.p);setDTQty(di,tid,p,inp.value);render();})(this)" title="Flex '+s.label+' el '+dayLabel+'"/>';
                fh+='<button onmousedown="event.preventDefault()" onclick="(function(el){var s=el.closest(\'.flex-qs\');var di=+s.dataset.di;var tid=decodeURIComponent(s.dataset.tid);var p=decodeURIComponent(s.dataset.p);var inp=el.previousElementSibling;var v=(parseInt(inp.value)||0)+1;inp.value=v;setDTQty(di,tid,p,v);render();})(this)">+</button>';
                fh+='</div></div>';
              });
              fh+='</div></div>';
            });
            fh+='</div>';
          });
          return fh;
        })()}
      </div>
      <!-- FIJAS -->
      <div class="task-section">
        <div class="task-section-lbl">Tareas fijas (del sistema)</div>`;
    DFLT.forEach(dt => {
      const editKey = `edit_dflt_${dt.id}`;
      const isEdit = S.showSubForm[editKey];
      const subFormKey = `sub_dflt_${dt.id}`;
      const showSubAdd = S.showSubForm[subFormKey];
      h += `<div class="task-fixed-row" style="flex-direction:column;align-items:stretch">`;
      if (isEdit) {
        h += `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <input class="inp" id="dflt_edit_${dt.id}" value="${esc(dt.label)}" style="margin:0;flex:1;font-size:17px;height:26px"/>
          <button class="btn btnb btnsm" onclick="
            var v=document.getElementById('dflt_edit_${dt.id}').value.trim();
            if(v){dt_rename('${dt.id}',v);}
            closeSubForm('${editKey}');">✓</button>
          <button class="btn btng btnsm" onclick="closeSubForm('${editKey}')"><i class="ti ti-x"></i></button>
        </div>`;
      } else {
        h += `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="task-fixed-name">${esc(dt.label)}</span>
          ${(dt.sub || []).map(s => `
            <span class="task-sub-chip">${esc(s.label)}
              <button onclick="dt_removeSub('${dt.id}','${s.id}')"
                style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:17px;padding:0 2px;line-height:1"><i class="ti ti-trash"></i></button>
            </span>`).join('')}
          <span class="badge-fija">fija</span>
          <div style="margin-left:auto;display:flex;gap:4px">
            <button class="btn btng btnsm" style="font-size:17px" onclick="toggleSubForm('${subFormKey}')">
              ${showSubAdd ? '✕ Cancelar' : '✏ Editar sub-tarea'}
            </button>
            <button class="btn btng btnsm" style="font-size:17px" onclick="openSubForm('${editKey}')">✏ Editar tarea</button>
          </div>
        </div>`;
      }
      if (showSubAdd) {
        h += `<div class="arow" style="margin-top:6px">
          <input class="inp" id="dflt_subinp_${dt.id}" placeholder="Nueva sub-tarea..." style="margin:0"/>
          <button class="btn btnb btnsm" onclick="
            var v=document.getElementById('dflt_subinp_${dt.id}').value;
            dt_addSub('${dt.id}',v);
            closeSubForm('${subFormKey}');
          ">+ Agregar</button>
        </div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;

    // PERSONALIZADAS
    h += `<div class="task-section">
      <div class="task-section-lbl">Tareas personalizadas</div>`;
    if (!customTasks.length) h += `<div class="emsg">Sin tareas personalizadas — agrega una abajo</div>`;

    customTasks.forEach(ct => {
      const ctId = ct.id;
      const ctIdSafe = ctId.replace(/'/g, "\\'");
      const showSub = S.showSubForm[ctId];
      h += `<div class="task-custom-row">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="task-fixed-name">${esc(ct.label)}</span>
          ${ct.fija ? `<span class="badge-fija">fija</span>` : ''}
          ${ct.dias && ct.dias.length > 0 ? `<span style="font-size:16px;color:var(--cy);background:var(--blb);border-radius:6px;padding:2px 7px;font-weight:700">${ct.dias.map(d=>DNAMES[d]).join(' · ')}</span>` : ''}
          ${(ct.sub || []).map(s => `
            <span class="task-sub-chip">${esc(s.label)}
              <button onclick="removeSubFromCustomTask('${ctIdSafe}','${s.id}')"
                style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:17px;padding:0 2px;line-height:1"><i class="ti ti-trash"></i></button>
            </span>`).join('')}
        </div>
        <div class="task-actions">
          <button class="btn btng btnsm" onclick="toggleSubForm('${ctIdSafe}')">
            ${showSub ? '<i class="ti ti-x"></i> Cancelar' : '<i class="ti ti-plus"></i> Sub-tarea'}
          </button>
          <button class="del-btn" onclick="removeCustomTask('${ctIdSafe}')"><i class="ti ti-trash" style="color:#ef4444"></i> Eliminar tarea</button>
        </div>
        ${showSub ? `<div class="arow" style="margin-top:6px">
          <input class="inp" id="subinp_${ctId}" placeholder="Nombre de la sub-tarea..." style="margin:0"/>
          <button class="btn btnb btnsm" onclick="
            var v=document.getElementById('subinp_${ctId}').value;
            addSubToCustomTask('${ctIdSafe}',v);
            closeSubForm('${ctIdSafe}');
          ">+ Agregar</button>
        </div>` : ''}
      </div>`;
    });

    // Formulario nueva tarea
    if (S.showAddTask) {
      const activeDaysForm = getActiveDays(S.week);
      h += `<div class="aform" style="margin-top:8px">
        <div style="font-size:16px;color:var(--cy);font-weight:700;margin-bottom:8px">Nueva tarea</div>
        <input class="inp" id="ntask-name" placeholder="Nombre de la tarea *"/>
        <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:16px;color:var(--mu)">
            <input type="checkbox" id="ntask-fija" style="accent-color:var(--gn);width:14px;height:14px"/>
            <span>Tarea fija <span style="color:var(--di);font-size:16px">(aparece todas las semanas)</span></span>
          </label>
        </div>
        <div style="font-size:17px;color:var(--di);margin:6px 0 4px;letter-spacing:1px">DÍAS (opcional — vacío = todos los días)</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
          ${activeDaysForm.map(({date: d, di}) => `
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:16px;
              background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:4px 10px;color:var(--mu)">
              <input type="checkbox" class="ntask-day" value="${di}"

        <div style="font-size:17px;color:var(--di);margin:6px 0 4px;letter-spacing:1px">SUB-TAREAS (opcional)</div>
        <div id="ntask-subs-list">`;
      (S.addTaskSubs || []).forEach((s, idx) => {
        h += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span class="task-sub-chip" style="font-size:16px">${esc(s)}</span>
          <button onclick="removeTaskSub(${idx})"
            style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:17px"><i class="ti ti-trash"></i></button>
        </div>`;
      });
      h += `</div>
        <div class="arow" style="margin-bottom:8px">
          <input class="inp" id="ntask-sub" placeholder="Nombre sub-tarea..." style="margin:0"
            onkeydown="if(event.key==='Enter'){var v=this.value.trim();if(v){S.addTaskSubs.push(v);render();}}" />

        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btnb" style="flex:1" onclick="saveNewTask()"><i class="ti ti-device-floppy"></i> Guardar tarea</button>
          <button class="btn btng" onclick="cancelAddTask()"><i class="ti ti-x"></i></button>
        </div>
      </div>`;
    } else {
      h += `<button class="btn btnb btnsm" style="margin-top:8px"
        onclick="toggleShowAddTask()">+ Nueva tarea</button>`;
    }

    h += `</div></div>`;
  }
  h += `</div>`;
  return h;
}

// ── Day column ────────────────────────────────────────────────────────────────
function renderDay(date, di) {
  const n = new Date();
  const isT = date.getUTCFullYear() === n.getFullYear() &&
              date.getUTCMonth() === n.getMonth() &&
              date.getUTCDate() === n.getDate();
  const w = wd();
  const allPpl = w.people || [];
  const dd = (w.days || {})[di] || {};
  let items = dd.items || [];

  const dateLabel = `${date.getUTCDate().toString().padStart(2,'0')}/${(date.getUTCMonth()+1).toString().padStart(2,'0')}`;

  // Progreso: items libres + personas asignadas a tareas fijas
  const _itemsTotal = (dd.items||[]).length;
  const _itemsDone  = (dd.items||[]).filter(x=>x.done).length;
  // Contar personas asignadas a tareas fijas (DFLT + yd0 + custom)
  const _personalACargo = allPpl.filter(p => LISTS.personal.includes(p));
  let _dtTotal = 0, _dtDone = 0;
  function _countTask(taskId) {
    const defPpl = (()=>{ const t=getT(taskId); return t.people!==undefined?t.people:(wd().people||[]); })();
    const assigned = getDayTaskPeople(di, taskId, defPpl).filter(p => LISTS.personal.includes(p));
    const effective = resolveEffectivePeople(di, assigned).filter(e => !e.isReplacement || !isRepExcludedFromTask(di, taskId, e.name));
    effective.forEach(e => {
      _dtTotal++;
      if (getDT(di, taskId, e.name).done) _dtDone++;
    });
  }
  DFLT.forEach(dt => {
    if (dt.sub.length) {
      getSubs(dt.id, dt).forEach(s => {
        const tid = `${dt.id}__${s.id}`;
        if (dt.id === 'flex') {
          const fp = (s.people||allPpl).filter(p=>LISTS.personal.includes(p));
          const fa = getDayTaskPeople(di, tid, fp).filter(p=>LISTS.personal.includes(p));
          const fe = resolveEffectivePeople(di, fa).filter(e=>!e.isReplacement||!isRepExcludedFromTask(di,tid,e.name));
          if (!fe.some(e=>(getDT(di,tid,e.name).qty||0)>0)) return;
        }
        _countTask(tid);
      });
    } else {
      _countTask(dt.id);
    }
  });
  (w.customTasks||[]).forEach(ct => {
    if (ct.dias && ct.dias.length>0 && !ct.dias.includes(di)) return;
    if ((ct.sub||[]).length) {
      (ct.sub||[]).forEach(s => _countTask(`${ct.id}__${s.id}`));
    } else {
      _countTask(ct.id);
    }
  });
  // yd0
  _personalACargo.forEach(p => {
    _dtTotal++;
    if (getDT(di,'yd0',p).done) _dtDone++;
  });
  const total = _itemsTotal + _dtTotal;
  const done  = _itemsDone  + _dtDone;
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  const progColor = pct >= 80 ? '#22c55e' : pct >= 40 ? '#f59e0b' : '#ef4444';

  const dots = '';

  let af = '';

  let ih = '';
  items.forEach(it => {
    const ex = S.expItems[it.id];
    const highlight = (txt) => esc(txt || '');
    ih += `<div class="ditem ${it.done ? 'done' : ''}">
      <div class="dirow">
        <input type="checkbox" ${it.done ? 'checked' : ''} onchange="updDItem(${di},'${it.id}',{done:this.checked})"
          style="accent-color:var(--gn);margin-top:3px;flex-shrink:0"/>
        <div style="flex:1;min-width:0">
          <div class="deq ${it.done ? 'done' : ''}">${highlight(it.equipo)}</div>
          ${it.pauta ? `<div class="dsub">${highlight(it.pauta)}</div>` : ''}
          ${it.descripcion ? `<div class="dsub">${highlight(it.descripcion)}</div>` : ''}
        </div>
        <button style="background:none;border:none;color:var(--di);font-size:16px;padding:0"
          onclick="toggleExpItem('${it.id}')">⋯</button>
        <button style="background:none;border:none;color:#374151;font-size:16px;padding:0"
          onclick="remDItem(${di},'${it.id}')"><i class="ti ti-trash"></i></button>
      </div>
      ${ex ? `<div class="dexp">
        <input class="inp" placeholder="Responsable" value="${esc(it.responsable || '')}"
          onchange="updDItem(${di},'${it.id}',{responsable:this.value})"/>
        <textarea class="inp" rows="2" placeholder="Comentario..."
          onchange="updDItem(${di},'${it.id}',{comentario:this.value})">${esc(it.comentario || '')}</textarea>
      </div>` : ''}
    </div>`;
  });

  // Nota interna
  const nota = getDayNote(di);
  const notaHtml = `<div class="day-notes">
    <div class="day-notes-lbl"><i class="ti ti-clipboard-text"></i> Nota del turno</div>
    <textarea rows="2" placeholder="Observaciones internas del día..."
      onchange="setDayNote(${di},this.value)"
      style="width:100%;background:transparent;border:none;color:var(--mu);font-size:16px;resize:none;outline:none;font-family:'Barlow',sans-serif;line-height:1.5">${esc(nota)}</textarea>
  </div>`;

  // Barra progreso — siempre visible
  const _tareaLabel = `${done} / ${total} tareas`;
  const _pctLabel = `${pct}%`;
  const isPast = !isT && date < new Date(new Date().setHours(0,0,0,0));
  const progHtml = `
    <div class="prog-wrap">
      <div class="prog-row">
        <span class="prog-tasks" style="color:var(--di)">${_tareaLabel}</span>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${progColor}"></div></div>
        <span class="prog-label" style="color:${progColor}">${_pctLabel}</span>
      </div>
    </div>`;

  // Chips de sección: verde = todos completos, rojo = pendiente
  function _sectionDone(taskId, defaultPpl) {
    const fp = defaultPpl.filter(p => LISTS.personal.includes(p));
    const assigned = getDayTaskPeople(di, taskId, fp).filter(p => LISTS.personal.includes(p));
    const effective = resolveEffectivePeople(di, assigned).filter(e => !e.isReplacement || !isRepExcludedFromTask(di, taskId, e.name));
    if (!effective.length) return null; // sin asignados, no mostrar
    return effective.every(e => getDT(di, taskId, e.name).done);
  }
  function _chip(label, isDone) {
    if (isDone === null) return '';
    const bg = isDone ? 'rgba(34,197,94,.18)' : 'rgba(239,68,68,.18)';
    const color = isDone ? '#4ade80' : '#f87171';
    return `<span style="background:${bg};color:${color};font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap">${label}</span>`;
  }
  const _cierreOtDone = _sectionDone('cierre-ots', allPpl);
  const _ert2Done     = _sectionDone('ert2', allPpl);
  const _ydDone       = _personalACargo.length > 0
    ? _personalACargo.some(p => getDT(di,'yd0',p).done)
    : null;
  const _asisDone     = (() => {
    if (!_personalACargo.length) return null;
    const att = (wd().attendance || {})[di] || {};
    return _personalACargo.every(p => att[p] !== undefined);
  })();
  const chipsHtml = `<div style="display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px 7px;background:rgba(0,0,0,.15)">
    ${_chip('Cierre OTs', _cierreOtDone)}
    ${_chip('ERT2.0', _ert2Done)}
    ${_chip('Yo Detengo', _ydDone)}
    ${_chip('Asistencia', _asisDone)}
  </div>`;

  return `<div class="dcol ${isT ? 'today' : isPast ? 'past' : ''}" id="dc${di}">
    <div class="dhdr">
      <div>
        <div class="lbl">${DNAMES[di]}</div>
        <div class="dnum">${dateLabel}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        ${isT ? `<span style="background:rgba(59,130,246,.2);color:var(--bl);font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px">HOY</span>` : isPast ? `<span style="background:rgba(100,116,139,.2);color:#94a3b8;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px">✓</span>` : ''}
      </div>
    </div>
    ${progHtml}
    ${chipsHtml}
    ${S.viewMode === 'compact' ? '' : renderDayTasks(di)}
    ${af}${ih}
    ${S.viewMode === 'compact' ? '' : notaHtml}
  </div>`;
}

// Helper: apply bold + bg color to a cell ref in a worksheet
function styleCell(ws, cellRef, bold, bgHex, fontColor, fontSize, hAlign) {
  if (!ws[cellRef]) return;
  ws[cellRef].s = {
    font: { bold: !!bold, color: { rgb: fontColor || 'FFFFFFFF' }, sz: fontSize || 11, name: 'Arial' },
    fill: bgHex ? { fgColor: { rgb: bgHex }, patternType: 'solid' } : undefined,
    alignment: { horizontal: hAlign || 'left', vertical: 'center', wrapText: true },
    border: {
      top:    { style: 'thin', color: { rgb: 'FFB0BEC5' } },
      bottom: { style: 'thin', color: { rgb: 'FFB0BEC5' } },
      left:   { style: 'thin', color: { rgb: 'FFB0BEC5' } },
      right:  { style: 'thin', color: { rgb: 'FFB0BEC5' } },
    }
  };
}
function styleRow(ws, rowIdx, numCols, bold, bgHex, fontColor, fontSize) {
  for (let c = 0; c < numCols; c++) {
    const ref = XLSX.utils.encode_cell({ r: rowIdx, c });
    if (!ws[ref]) ws[ref] = { t: 's', v: '' };
    styleCell(ws, ref, bold, bgHex, fontColor, fontSize);
  }
}
function styleDataRow(ws, rowIdx, numCols, alt) {
  for (let c = 0; c < numCols; c++) {
    const ref = XLSX.utils.encode_cell({ r: rowIdx, c });
    if (!ws[ref]) ws[ref] = { t: 's', v: '' };
    ws[ref].s = {
      font: { sz: 10, name: 'Arial', color: { rgb: alt ? 'FF1E293B' : 'FF0F172A' } },
      fill: alt ? { fgColor: { rgb: 'FFEFF6FF' }, patternType: 'solid' } : undefined,
      alignment: { vertical: 'center', wrapText: true },
      border: {
        top:    { style: 'thin', color: { rgb: 'FFE2E8F0' } },
        bottom: { style: 'thin', color: { rgb: 'FFE2E8F0' } },
        left:   { style: 'thin', color: { rgb: 'FFE2E8F0' } },
        right:  { style: 'thin', color: { rgb: 'FFE2E8F0' } },
      }
    };
  }
}

function exportExcel() {
  if (isTecView()) { showLimitAlert('Vista Técnico', 'La descarga de Excel no está disponible en esta vista.'); return; }
  const w = wd(); const k = wk(S.week);
  const wb = XLSX.utils.book_new();
  const days = getWeekDays(S.week);
  const allPpl = w.people || [];
  const tr = turn(S.week);
  const semana = getWeekLabel(S.week);

  const activeDays = getActiveDays(S.week); // días reales del turno

  // ── Colores ────────────────────────────────────────────────────────────────
  const C = {
    navy:   'FF1E3A5F',
    blue:   'FF3B82F6',

    amber:  'FFB45309',

    header: 'FF1D4ED8',
    alt:    'FFEFF6FF',
    white:  'FFFFFFFF',
    dark:   'FF0F172A',
    red:    'FF991B1B',
    purple: 'FF6D28D9',
